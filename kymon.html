<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỳ Môn Độn Giáp – Bản chuẩn</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0e1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        .control {
            width: 100%;
            max-width: 920px;
            padding: 8px 0 12px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .control-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px 40px;
            width: 100%;
        }
        .group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }
        .group label {
            font-size: 1.5rem;
            margin-right: 2px;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
        }
        .group label:hover { transform: scale(1.15); color: #f7971e; }
        .group .val-input {
            width: 44px;
            text-align: center;
            font-weight: bold;
            color: #fff;
            font-size: 1.45rem;
            padding: 4px 2px;
            background: #1a2a4a;
            border: 1px solid #2a4a7a;
            border-radius: 8px;
            outline: none;
            transition: 0.2s;
        }
        .group .val-input:focus { border-color: #f7971e; background: #1a2a5a; }
        .group .val-input.year-input { width: 60px; }
        .group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #f7971e;
            cursor: pointer;
            margin: 0 4px;
        }
        .group .am-label { font-size: 0.85rem; color: #aaa; font-weight: 500; }

        .gio-compact {
            width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .gio-compact::-webkit-scrollbar { display: none; }
        .gio-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 2px;
        }
        .gio-table td { padding: 0; }

        .top-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }
        .top-table td { vertical-align: middle; text-align: center; padding: 2px 4px; }
        .top-btn-cell { white-space: nowrap; }

        .gio-item-mini {
            padding: 4px 2px;
            border-radius: 8px;
            border: 2px solid #2a4a7a;
            background: #1a1a3e;
            text-align: center;
            vertical-align: middle;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .gio-item-mini:hover { border-color: #f7971e; }
        .gio-item-mini.now { outline: 2px solid #ffffff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.8); z-index: 2; position: relative; }
        .gio-item-mini .line1 { display: block; font-size: 0.72rem; color: #fff; font-weight: 600; }
        .gio-item-mini .line2 { display: block; font-size: 0.6rem; color: #ddd; }

        #board {
            width: 100%;
            max-width: 576px;
            background: transparent;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            margin: 70px auto 30px auto;
            border: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .cell {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 5px solid #2a4a7a;
            background: #1a1a40;
            overflow: hidden;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.15), 0 4px 14px rgba(0, 0, 0, 0.5);
        }
        .cell:hover { border-color: #f7971e; z-index: 2; }
        .cell-inner {
            position: absolute;
            inset: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: transform 0.4s ease;
        }
        .cell .cung { font-weight: bold; font-size: 0.9rem; color: #fff; }
        .cell .row { line-height: 1.3; font-size: 0.72rem; color: #b0b0b0; }
        .cell .mon { font-weight: bold; color: #7bed9f; }
        .cell .than { font-weight: bold; color: #ffa502; }
        .cell .tinh { color: #70a1ff; }
        .cell .thien { color: #e0a0ff; }
        .cell .dia { color: #a4b0be; }
        .cell .gio { color: #ffd93d; }
        .cell .diem { font-weight: bold; }
        .cell .diem.diem-tot { color: #7bed9f; }
        .cell .diem.diem-xau { color: #ff6b6b; }
        .cell .diem.diem-trung { color: #c8c8d0; }
        .cell-table { width: auto; margin: 0 auto; border-collapse: collapse; }
        .cell-table td { padding: 0 2px; vertical-align: middle; }
        .cell-table .ci { text-align: right; width: 20px; font-size: 0.7rem; white-space: nowrap; }
        .cell-table .ct { text-align: left; font-size: 0.7rem; white-space: nowrap; }
        /* Ô trung tâm (Trung cung): cho chữ xuống dòng, căn giữa */
        .cell.center-cell .cell-table .ct { white-space: normal; text-align: center; line-height: 1.3; }
        /* 8 hướng thuần Việt quanh ô trung tâm (như la bàn), luôn thẳng đứng */
        .center-dirs { position: absolute; inset: 0; pointer-events: none; }
        .center-dirs .cdir { position: absolute; transform: translate(-50%, -50%); font-size: 0.5rem; color: #a4b0be; font-weight: bold; }
        .compass-controls .gio-icon { font-size: 1.2rem; min-width: 42px; text-align: right; }

        @media (max-width: 700px) {
            .control-row { gap: 12px 20px; }
            .group .val-input { width: 42px; font-size: 1.3rem; padding: 4px 2px; }
            .group .val-input.year-input { width: 58px; }
            .group label { font-size: 1.4rem; }
            .gio-item-mini { padding: 3px 2px; font-size: 0.6rem; }
            .cell .cung { font-size: 0.8rem; }
            .cell .row { font-size: 0.62rem; }
        }
        @media (max-width: 450px) {
            .control-row { gap: 8px 12px; }
            .group .val-input { width: 34px; font-size: 1.1rem; padding: 2px; }
            .group .val-input.year-input { width: 48px; }
            .group label { font-size: 1.2rem; }
            .gio-item-mini { padding: 2px 1px; font-size: 0.55rem; }
            .cell-inner { inset: 4px; gap: 1px; }
            .cell .cung { font-size: 0.58rem; }
            .cell .row { font-size: 0.46rem; }
        }

        /* ===== La bàn (Compass) ===== */
        .compass-panel {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            margin: 0 0 16px;
            width: 100%;
            max-width: 920px;
        }
        .compass-top { width: 100%; }
        .compass-top-table { width: 100%; border-collapse: collapse; }
        .compass-top-table td { vertical-align: middle; padding: 2px 4px; }
        .rose-cell { width: 96px; text-align: center; }
        .info-cell { text-align: left; }
        .rose {
            position: relative;
            width: 96px;
            height: 96px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle, #1a1a40 0%, #0b0e1a 100%);
            border: 3px solid #2a4a7a;
            box-shadow: 0 0 14px rgba(42, 74, 122, 0.6);
            cursor: pointer;
        }
        .rose.active { border-color: #ffffff; box-shadow: 0 0 16px rgba(255, 255, 255, 0.6); }
        .rose-ring { position: absolute; inset: 0; transition: transform 0.25s ease; }
        .rose-label {
            position: absolute;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 0.62rem;
            color: #a4b0be;
        }
        .rose-label.main { color: #ff6b6b; font-size: 0.85rem; }
        .rose-marker {
            position: absolute;
            left: 50%;
            top: -3px;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 14px solid #ffd93d;
            z-index: 2;
        }
        .compass-heading { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
        .compass-heading .deg { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .compass-heading .dir { font-size: 1.1rem; font-weight: bold; color: #7bed9f; }
        .compass-heading .diem-heading { font-size: 1.1rem; font-weight: bold; }
        .compass-heading .diem-heading.diem-tot { color: #7bed9f; }
        .compass-heading .diem-heading.diem-xau { color: #ff6b6b; }
        .compass-heading .diem-heading.diem-trung { color: #c8c8d0; }
        .compass-heading .gio-heading { font-size: 1.1rem; font-weight: normal; color: #ffd93d; white-space: nowrap; }
        /* Giờ: desktop hiện tên chi, mobile hiện icon con giáp */
        .gio-ico { display: none; }
        .gio-txt { display: inline; }
        /* Màu dòng 1 la bàn theo trọng số */
        .compass-heading.diem-tot .deg, .compass-heading.diem-tot .dir, .compass-heading.diem-tot .gio-heading { color: #7bed9f; }
        .compass-heading.diem-xau .deg, .compass-heading.diem-xau .dir, .compass-heading.diem-xau .gio-heading { color: #ff6b6b; }
        .compass-heading.diem-trung .deg, .compass-heading.diem-trung .dir, .compass-heading.diem-trung .gio-heading { color: #c8c8d0; }
        .compass-palace {
            margin-top: 2px;
            font-size: 0.95rem;
            color: #ffd93d;
            white-space: nowrap;
        }
        .compass-luan-giai {
            margin: 0;
            text-align: left;
            background: #000000;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #d8d8e0;
        }
        .compass-luan-giai .lg-title { font-weight: bold; color: #ffd93d; font-size: 0.95rem; margin-bottom: 6px; }
        .compass-luan-giai .lg-sec { margin: 4px 0; }
        .compass-luan-giai .lg-tag { font-weight: bold; color: #7dd3fc; }
        .compass-luan-giai .lg-hanh { color: #a4b0be; }
        .compass-luan-giai .lg-verdict { margin: 8px 0; padding: 6px 8px; border-radius: 6px; font-weight: bold; }
        .compass-luan-giai .lg-verdict.tot { background: rgba(46, 204, 113, 0.18); color: #7bed9f; }
        .compass-luan-giai .lg-verdict.xau { background: rgba(231, 76, 60, 0.18); color: #ff6b6b; }
        .compass-luan-giai .lg-verdict.trung { background: rgba(241, 196, 15, 0.15); color: #ffd93d; }
        .compass-luan-giai .lg-block { margin: 6px 0; }
        .compass-luan-giai .lg-h { font-weight: bold; color: #fff; margin-bottom: 2px; }
        .compass-luan-giai ul { margin: 2px 0 4px 18px; padding: 0; }
        .compass-luan-giai li { margin: 1px 0; }
        .compass-luan-giai .lg-do { color: #7bed9f; }
        .compass-luan-giai .lg-dont { color: #ff6b6b; }
        .compass-luan-giai .lg-boost { color: #7dd3fc; }
        .compass-luan-giai .lg-hoa { color: #ffd93d; }
        .compass-luan-giai .lg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 12px; margin-top: 0; }
        .compass-luan-giai .lg-item {
            padding: 4px 6px;
            border-radius: 6px;
        }
        .compass-luan-giai .lg-item.tot { background: rgba(46, 204, 113, 0.30); }
        .compass-luan-giai .lg-item.xau { background: rgba(231, 76, 60, 0.30); }
        .compass-luan-giai .lg-item.trung { background: rgba(241, 196, 15, 0.26); }
        .compass-luan-giai .cd-card {
            padding: 4px 6px;
            border-radius: 6px;
        }
        .compass-luan-giai .cd-card.tot { background: rgba(46, 204, 113, 0.30); }
        .compass-luan-giai .cd-card.xau { background: rgba(231, 76, 60, 0.30); }
        .compass-luan-giai .cd-card.trung { background: rgba(241, 196, 15, 0.26); }
        @media (max-width: 700px) {
            .compass-luan-giai .lg-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .compass-luan-giai .cd-head { margin-bottom: 0; }
        .compass-luan-giai .cd-title { font-weight: bold; color: #fff; font-size: 0.82rem; text-transform: uppercase; }
        .compass-luan-giai .cd-title.tot { color: #7bed9f; }
        .compass-luan-giai .cd-title.xau { color: #ff6b6b; }
        .compass-luan-giai .cd-title.trung { color: #ffd93d; }
        .compass-luan-giai .cd-detail { font-size: 0.76rem; color: #c8c8d0; line-height: 1.45; }
        .compass-luan-giai .cd-detail b { color: #e8e8ee; }
        .compass-luan-giai .cd-item { margin: 0; }
        .compass-luan-giai .cd-sign { margin-right: 3px; font-weight: bold; }
        .compass-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #a4b0be;
        }
        .compass-controls input[type="range"] { flex: 1; min-width: 120px; accent-color: #f7971e; touch-action: none; }
        .compass-controls .heading-val { font-weight: bold; color: #fff; min-width: 42px; text-align: right; }
        .compass-panel.hidden { display: none; }
        .compass-luan-giai.hidden { display: none; }
        .compass-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #1a2a4a, #2a4a7a);
            border: 2px solid #f7971e;
            border-radius: 999px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: 0.2s;
        }
        .compass-toggle:hover { transform: scale(1.05); box-shadow: 0 0 14px rgba(247, 151, 30, 0.5); }
        .compass-toggle.btn-tot { background: rgba(46, 204, 113, 0.30); border-color: #2ecc71; }
        .compass-toggle.btn-xau { background: rgba(231, 76, 60, 0.30); border-color: #e74c3c; }
        .compass-toggle.btn-trung { background: #1a2a4a; border-color: #f1c40f; }
        .compass-toggle.active { box-shadow: 0 0 16px rgba(255, 255, 255, 0.55); }
        /* Trên thiết bị cảm ứng: bỏ hiệu ứng hover (tránh kẹt hover làm lệch màu) */
        @media (hover: none) {
            .compass-toggle:hover { transform: none; box-shadow: none; }
        }
        .compass-status { font-size: 0.85rem; color: #a4b0be; margin-top: 10px; }
        .compass-status.live { color: #7bed9f; }
        .grid { transition: transform 0.4s ease; transform-origin: center center; }

        /* === Mobile layout (≤500px) === */
        @media (max-width: 500px) {
            /* Dòng 1: chuyển 1 hàng 3 cột -> 1 cột 3 dòng */
            .top-table, .top-table tbody, .top-table tr, .top-table td {
                display: block;
                width: 100%;
            }
            .top-table td { padding: 3px 0; }
            /* 12 canh giờ: chỉ icon + giờ bắt đầu */
            .gio-ten, .gio-end { display: none; }
            /* Giờ: mobile hiện icon con giáp thay tên chi */
            .gio-ico { display: inline; }
            .gio-txt { display: none; }
            /* La bàn nhỏ lại, dòng 2 wrap, bar vừa màn hình */
            .rose { width: 72px; height: 72px; }
            .rose-cell { width: 72px; }
            .compass-toggle { width: 100%; justify-content: center; }
            .compass-heading .deg { font-size: 0.9rem; }
            .compass-heading .dir { font-size: 0.9rem; }
            .compass-heading .diem-heading { font-size: 0.9rem; }
            .compass-heading .gio-heading { font-size: 0.9rem; }
            .compass-palace { white-space: normal; font-size: 0.8rem; }
            .compass-controls input[type="range"] { min-width: 0; }
            .cell-table td { padding: 0 1px; }
            .cell-table .ci, .cell-table .ct { font-size: 0.55rem; }
            .cell-inner { gap: 0; }
        }
    </style>
</head>
<body>

    <!-- Kỳ Môn Độn Giáp – bản chuẩn (rebuild trigger) -->
    <div class="control">
        <table class="top-table">
            <tr>
                <td class="top-cell">
                    <div class="group">
                        <label id="resetSun" title="Click để reset về giờ hiện tại">☀️</label>
                        <input type="text" class="val-input" id="duongDay" data-field="day" value="01" inputmode="numeric">
                        <input type="text" class="val-input" id="duongMonth" data-field="month" value="01" inputmode="numeric">
                        <input type="text" class="val-input year-input" id="duongYear" data-field="year" value="2024" inputmode="numeric">
                        <input type="text" class="val-input" id="duongHour" data-field="hour" value="00" inputmode="numeric">
                    </div>
                </td>
                <td class="top-cell">
                    <div class="group">
                        <label id="resetMoon" title="Click để reset về giờ hiện tại">🌙</label>
                        <input type="text" class="val-input" id="amDay" data-field="day" value="01" inputmode="numeric">
                        <input type="text" class="val-input" id="amMonth" data-field="month" value="01" inputmode="numeric">
                        <input type="text" class="val-input year-input" id="amYear" data-field="year" value="2024" inputmode="numeric">
                        <input type="text" class="val-input" id="amHour" data-field="hour" value="00" inputmode="numeric">
                        <label class="am-label">Nhuận</label>
                        <input type="checkbox" id="amNhuan" onchange="capNhatTuAm()">
                    </div>
                </td>
            </tr>
        </table>
        <div class="control-row" style="justify-content: center; width: 100%; overflow: hidden;">
            <div class="gio-compact" id="gioCompact"></div>
        </div>
    </div>

    <div class="compass-panel" id="compassPanel">
        <div class="compass-top">
            <table class="compass-top-table">
                <tr>
                    <td class="rose-cell" rowspan="3">
                        <div class="rose" id="rose">
                            <div class="rose-ring" id="roseRing">
                                <span class="rose-label main" style="top:4%;left:50%">B</span>
                                <span class="rose-label" style="top:13%;left:85%">ĐB</span>
                                <span class="rose-label" style="top:50%;left:94%">Đ</span>
                                <span class="rose-label" style="top:87%;left:85%">ĐN</span>
                                <span class="rose-label" style="top:96%;left:50%">N</span>
                                <span class="rose-label" style="top:87%;left:15%">TN</span>
                                <span class="rose-label" style="top:50%;left:6%">T</span>
                                <span class="rose-label" style="top:13%;left:15%">TB</span>
                            </div>
                            <div class="rose-marker"></div>
                        </div>
                    </td>
                    <td class="info-cell">
                        <div class="compass-heading" id="compassHeading">
                            <span class="gio-heading" id="compassGio"></span>
                            <span class="deg" id="compassDeg">0°</span>
                            <span class="dir" id="compassDir">Bắc</span>
                            <span class="diem-heading" id="compassDiem"></span>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="info-cell">
                        <div class="compass-palace" id="compassPalace">Cung Khảm — Bắc</div>
                    </td>
                </tr>
                <tr>
                    <td class="info-cell">
                        <div class="compass-controls">
                            <input type="range" id="headingSlider" min="0" max="359" value="0" step="1">
                            <span class="heading-val" id="headingVal">0°</span>
                        </div>
                        <div class="compass-controls gio-controls">
                            <input type="range" id="gioSlider" min="0" max="11" value="0" step="1">
                            <span class="gio-icon" id="gioIcon">🐭</span>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
        <div class="compass-luan-giai hidden" id="compassLuanGiai"></div>
        <div class="compass-status" id="compassStatus"></div>
    </div>

    <div id="board"></div>

    <script>
        // ================================================================
        // 1. THƯ VIỆN ÂM LỊCH HỒ NGỌC ĐỨC (đầy đủ)
        // ================================================================
        const PI = Math.PI;
        function INT(x) { return Math.floor(x); }

        function jdFromDate(dd, mm, yy) {
            var a, y, m, jd;
            a = INT((14 - mm) / 12);
            y = yy + 4800 - a;
            m = mm + 12 * a - 3;
            jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - INT(y / 100) + INT(y / 400) - 32045;
            if (jd < 2299161) {
                jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - 32083;
            }
            return jd;
        }

        function jdToDate(jd) {
            var a, b, c, d, e, m, day, month, year;
            if (jd > 2299160) {
                a = jd + 32044;
                b = INT((4 * a + 3) / 146097);
                c = a - INT((b * 146097) / 4);
            } else {
                b = 0;
                c = jd + 32082;
            }
            d = INT((4 * c + 3) / 1461);
            e = c - INT((1461 * d) / 4);
            m = INT((5 * e + 2) / 153);
            day = e - INT((153 * m + 2) / 5) + 1;
            month = m + 3 - 12 * INT(m / 10);
            year = b * 100 + d - 4800 + INT(m / 10);
            return { day: day, month: month, year: year };
        }

        function getNewMoonDay(k, timeZone) {
            var T, T2, T3, dr, Jd1, M, Mpr, F, C1, deltat, JdNew;
            T = k / 1236.85;
            T2 = T * T;
            T3 = T2 * T;
            dr = PI / 180;
            Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;

            135, 150, 165, 180, 195, 210, 225, 240, 255, 270, 285, 300];

        // Tìm ngày Julian khi Mặt Trời đạt kinh độ hoàng đạo nhất định (ngày giao tiết)
        function findTietKhiJd(name, year) {
            const t = TIET_KHI.find(x => x.name === name);
            if (!t) return jdFromDate(1, 1, year);
            const idx = TIET_KHI.indexOf(t);
            const longitude = TIET_KHI_LONG[idx];
            const approxJd = jdFromDate(t.d, t.m, year);

            let jd1 = approxJd - 3;
            let lng1 = getSunLongitudeDeg(jd1, 7.0);
            for (let i = 0; i < 8; i++) {
                const jd2 = jd1 + 1;
                const lng2 = getSunLongitudeDeg(jd2, 7.0);
                let diff = lng2 - lng1;
                if (diff < -180) diff += 360;
                if (diff > 180) diff -= 360;
                const start = ((longitude - lng1) % 360 + 360) % 360;
                if (diff > 0 && start <= diff) {
                    const frac = start / diff;
                    const crossJd = jd1 + frac;
                    return Math.floor(crossJd + 0.5);
                }
                jd1 = jd2;
                lng1 = lng2;
            }
            return approxJd;
        }

        // Tiết khí sắp tới (sau hoặc bằng ngày đang xét) — bản chuẩn dùng tiết khí KẾ TIẾP
        function getTietKhi(month, day, year) {
            const targetJd = jdFromDate(day, month, year);
            let best = null;
            for (let y of [year, year + 1]) {
                for (let t of TIET_KHI) {
                    const termJd = findTietKhiJd(t.name, y);
                    if (termJd >= targetJd) {
                        if (!best || termJd < best.jd) best = { name: t.name, jd: termJd };
                    }
                }
            }
            return best || { name: 'Đông Chí', jd: targetJd - 15 };
        }

        function tinhCuc(month, day, year) {
            const jd = jdFromDate(day, month, year);

            // Xác định Nguyên (Thượng/Trung/Hạ) theo chu kỳ 60 Giáp Tý (cố định):
            // Phù Đầu là ngày Giáp/Kỷ, chỉ số luôn là bội của 5 trong 60 Giáp Tý.
            // Địa chi của Phù Đầu quyết định Nguyên:
            //   Tý/Ngọ/Mão/Dậu (Tứ Trọng, chi % 3 == 0) -> Thượng nguyên
            //   Thìn/Tuất/Sửu/Mùi (Tứ Mộ, chi % 3 == 1) -> Hạ nguyên
            //   Dần/Thân/Tỵ/Hợi (Tứ Sinh, chi % 3 == 2) -> Trung nguyên
            const dayInfo = getDayCanChi(jd);
            const n = getCanChiIndex(dayInfo.ganIdx, dayInfo.chiIdx);
            const fu = n - (n % 5);   // chỉ số Phù Đầu (bội của 5)
            const chi = fu % 12;      // Địa chi của Phù Đầu
            const yuanIdx = chi % 3;  // 0=Thượng, 1=Hạ, 2=Trung
            const nguyen = ['Thượng', 'Hạ', 'Trung'][yuanIdx];

            // Tiết khí xét theo ngày Phù Đầu (超神接气): lấy tiết khí kế tiếp tính từ Phù Đầu.
            const fuDate = jdToDate(jd - (n % 5));
            const tiet = getTietKhi(fuDate.month, fuDate.day, fuDate.year);

            const info = CUC_TRA[tiet.name];
            if (info && info[nguyen]) {
                return {
                    so: info[nguyen].cuc,
                    duong: info[nguyen].duong,
                    tiet: tiet.name,
                    nguyen: nguyen
                };
            }
            return { so: 5, duong: true, tiet: tiet.name, nguyen: nguyen };
        }

        // ================================================================
        // 5. HÀM AN BÀN KỲ MÔN (CHUẨN)
        // ================================================================
        function getCanChi(year) {
            const gan = ['Giáp', 'Ất', 'Bính', 'Đinh', 'Mậu', 'Kỷ', 'Canh', 'Tân', 'Nhâm', 'Quý'];
            const chi = ['Tý', 'Sửu', 'Dần', 'Mão', 'Thìn', 'Tỵ', 'Ngọ', 'Mùi', 'Thân', 'Dậu', 'Tuất', 'Hợi'];
            let ganIdx = (year - 4) % 10;
            let chiIdx = (year - 4) % 12;
            if (ganIdx < 0) ganIdx += 10;
            if (chiIdx < 0) chiIdx += 12;
            return { gan: gan[ganIdx], chi: chi[chiIdx], ganIdx: ganIdx, chiIdx: chiIdx };
        }

        function getDayCanChi(jd) {
            const gan = ['Giáp', 'Ất', 'Bính', 'Đinh', 'Mậu', 'Kỷ', 'Canh', 'Tân', 'Nhâm', 'Quý'];
            const chi = ['Tý', 'Sửu', 'Dần', 'Mão', 'Thìn', 'Tỵ', 'Ngọ', 'Mùi', 'Thân', 'Dậu', 'Tuất', 'Hợi'];
            // Can chi ngày chuẩn: số thứ tự 60 Giáp Tý = (jd + 49) % 60 (Giáp Tý = 0)
            // Kiểm chứng: 01/10/1949 (jd=2433191) -> Giáp Tý; 10/02/2024 (jd=2460351) -> Giáp Thìn
            const idx = ((jd + 49) % 60 + 60) % 60;
            const ganIdx = idx % 10;
            const chiIdx = idx % 12;
            return { gan: gan[ganIdx], chi: chi[chiIdx], ganIdx: ganIdx, chiIdx: chiIdx };
        }

        function anBan(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const hours = date.getHours();
            const jd = jdFromDate(day, month, year);
            const lunar = convertSolar2Lunar(day, month, year, 7.0);
            const yearCanChi = getCanChi(lunar.year);
            const dayInfo = getDayCanChi(jd);

            // 1. Can chi giờ
            const gioChi = Math.floor((hours + 1) / 2) % 12; // 0=Tý, 1=Sửu, ...
            const gioGan = (dayInfo.ganIdx * 2 + gioChi) % 10;

            // 2. Xác định cục (phép Sách Bổ)
            const cuc = tinhCuc(month, day, year);

            // 3. Sắp Địa bàn (Kỳ Nghi) theo cục số.
            // Thứ tự Kỳ Nghi: Mậu(1) Kỷ(2) Canh(3) Tân(4) Nhâm(5) Quý(6) Đinh(7) Bính(8) Ất(9).
            // Dương độn đi thuận (tăng cung), Âm độn đi nghịch (giảm cung).
            const diaBan = {};    // cung -> kỳ nghi index (1..9)
            const kyTaiCung = {}; // kỳ nghi index -> cung
            let kyIdx = 1;
            let cungIdx = cuc.so;
            for (let i = 0; i < 9; i++) {
                diaBan[cungIdx] = kyIdx;
                kyTaiCung[kyIdx] = cungIdx;
                if (cuc.duong) {
                    cungIdx = (cungIdx % 9) + 1;
                } else {
                    cungIdx = ((cungIdx - 2 + 9) % 9) + 1;
                }
                kyIdx++;
            }

            // 4. Tìm Trực Phù (sao) và Trực Sử (cửa) theo Tuần (旬) của GIỜ (时旬首).
            // Trực Phù = Cửu Tinh có bản cung chứa Lục Nghi của Tuần Thủ (trên Địa bàn);
            // Trực Sử = Bát Môn có bản cung đó. Trung cung (5) ký gửi Khôn (2).
            const chiIndex = getCanChiIndex(gioGan, gioChi);
            const tuanIdx = Math.floor(chiIndex / 10);
            const tuan = TUAN_INFO[tuanIdx] || TUAN_INFO[0];
            const giapKyCung = kyTaiCung[tuan.ky];      // cung chứa Lục Nghi của Tuần Thủ
            const chiefHome = (giapKyCung === 5) ? 2 : giapKyCung; // Trung cung ký Khôn
            const trucPhuTinh = chiefHome;              // sao có bản cung = cung chứa Tuần Thủ
            const trucSuMon = MON_HOME_INV[chiefHome];  // cửa có bản cung = cung đó

            // 5. Trực Phù tùy Thì Can (值符随时干)
            let trucPhuCung;
            if (gioGan === 0) {
                // Giờ Giáp: Trực Phù về bản cung của Tuần Thủ
                trucPhuCung = giapKyCung;
            } else {
                trucPhuCung = kyTaiCung[CAN_TO_KY[gioGan]];
            }

            // 6. Xoay Thiên bàn theo vòng Lạc Thư: Lục Nghi của Tuần Thủ di chuyển tới cung Thì Can.
            const chiefCung = (giapKyCung === 5) ? 2 : giapKyCung;
            const thiCanCung = (trucPhuCung === 5) ? 2 : trucPhuCung;
            const chiefRing = LUO_SHU.indexOf(chiefCung);
            const thiCanRing = LUO_SHU.indexOf(thiCanCung);
            const ringSteps = cuc.duong
                ? ((thiCanRing - chiefRing + 8) % 8)   // Dương độn: bay thuận
                : ((chiefRing - thiCanRing + 8) % 8);  // Âm độn: bay nghịch
            const thienBan = {};
            thienBan[5] = diaBan[5]; // Trung cung giữ nguyên Kỳ Nghi
            for (let i = 0; i < 8; i++) {
                const palace = LUO_SHU[i];
                const src = cuc.duong
                    ? LUO_SHU[(i - ringSteps + 8) % 8]
                    : LUO_SHU[(i + ringSteps) % 8];
                thienBan[palace] = diaBan[src];
            }

            // 7. An Cửu tinh (转盘: 8 sao ngoài xoay theo vòng Lạc Thư, Thiên Cầm giữ Trung cung)
            const starAtPalace = {};
            const starRing = [1, 8, 3, 4, 9, 2, 7, 6]; // Bồng Nhậm Xung Phụ Anh Nhuế Trụ Tâm (theo vòng Lạc Thư)
            let anchor = (trucPhuCung === 5) ? 2 : trucPhuCung; // Trung cung ký Khôn
            let ringPos = LUO_SHU.indexOf(anchor);
            if (ringPos === -1) ringPos = 0;
            let starIdx = starRing.indexOf(trucPhuTinh);
            if (starIdx === -1) starIdx = 0; // Trực Phù là Thiên Cầm (số 5): ký Khôn
            for (let i = 0; i < 8; i++) {
                const palace = LUO_SHU[ringPos];
                starAtPalace[palace] = starRing[starIdx];
                ringPos = (ringPos + (cuc.duong ? 1 : -1) + 8) % 8;
                starIdx = (starIdx + (cuc.duong ? 1 : -1) + 8) % 8;
            }
            starAtPalace[5] = 5; // Thiên Cầm luôn giữ Trung cung

            // 8. An Bát môn - Trực Sử tùy Thì Cung (值使随时宫).
            // Cửa Trực Sử bay tới cung của Thì Chi (giờ). SHI_TARGET: vị trí vòng Lạc Thư theo Địa chi giờ (Tý..Hợi).
            const SHI_TARGET = [6, 7, 5, 3, 2, 5, 0, 4, 1, 6, 7, 5]; // index trong LUO_SHU
            const gatePos = SHI_TARGET[gioChi];
            const trucSuCung = LUO_SHU[gatePos];

            const doorAtPalace = {};
            const doorOrder = [1, 2, 3, 4, 5, 6, 7, 8]; // Hưu Sinh Thương Đỗ Cảnh Tử Kinh Khai
            let doorIdx = doorOrder.indexOf(trucSuMon);
            let pos = gatePos;
            for (let i = 0; i < 8; i++) {
                const palace = LUO_SHU[pos];
                doorAtPalace[palace] = doorOrder[doorIdx];
                pos = (pos + (cuc.duong ? 1 : -1) + 8) % 8;
                doorIdx = (doorIdx + (cuc.duong ? 1 : -1) + 8) % 8;
            }

            // 9. An Bát thần
            const spiritAtPalace = {};
            let spiritStart = trucPhuCung;
            if (spiritStart === 5) spiritStart = 2; // Trực Phù ở Trung cung thì thần ký Khôn
            let spiritPos = LUO_SHU.indexOf(spiritStart);
            for (let i = 0; i < 8; i++) {
                const palace = LUO_SHU[spiritPos];
                spiritAtPalace[palace] = i + 1;
                spiritPos = (spiritPos + (cuc.duong ? 1 : -1) + 8) % 8;
            }

            // 10. Đổ vào bàn
            const cung = [];
            for (let i = 0; i <= 9; i++) {
                cung[i] = { ten: TEN_CUNG[i], mon: '', than: '', tinh: '', dia: '', thien: '' };
            }
            for (let p = 1; p <= 9; p++) {
                cung[p].mon = TEN_MON[doorAtPalace[p]] || '';
                cung[p].than = (cuc.duong ? TEN_THAN_DUONG : TEN_THAN_AM)[spiritAtPalace[p]] || '';
                cung[p].tinh = TEN_TINH[starAtPalace[p]] || '';
                cung[p].dia = TEN_KI[diaBan[p]] || '';
                cung[p].thien = TEN_KI[thienBan[p]] || '';
            }

            // Lưu thông tin
            cung['info'] = {
                lunar: lunar,
                yearCanChi: yearCanChi,
                dayCanChi: dayInfo.gan + ' ' + dayInfo.chi,
                dayGanIdx: dayInfo.ganIdx,
                cuc: cuc,
                gioGan: gioGan,
                gioChi: gioChi,
                trucPhu: { cung: trucPhuCung, tinh: trucPhuTinh },
                trucSu: { mon: trucSuMon, cung: trucSuCung },
                date: date
            };

            return cung;
        }

        // 6. HIỂN THỊ BÀN VÀ CÁC

        function getMauSac(mon) {

                dontList += ' Tránh tự cao, gây mất lòng.';
            } else if (than === 'Lục Hợp') {
                doList += ' Hợp tác, đoàn kết, giúp đỡ người khác.';
                dontList += ' Tránh đơn độc, ích kỷ.';
            }
            return { do: doList, dont: dontList };
        }
        // ================================================================
        // 6. GIỜ HOÀNG ĐẠO / HẮC ĐẠO (thu nhỏ, chỉ giờ bắt đầu)
        // ================================================================
        // 12 sao Hoàng Đạo / Hắc Đạo (thứ tự cố định, luân phiên theo chi can giờ).
        // good=true: Hoàng Đạo (cát); false: Hắc Đạo (hung).
        // level để tô gradient: càng tốt càng xanh, càng xấu càng đỏ.
        const HOANG_HAC_STARS = [
            { name: 'Thanh Long', good: true,  level: 0 },  // cát nhất
            { name: 'Minh Đường', good: true,  level: 1 },
            { name: 'Thiên Hình', good: false, level: 7 },
            { name: 'Chu Tước',   good: false, level: 6 },
            { name: 'Kim Quỹ',    good: true,  level: 2 },
            { name: 'Thiên Đức',  good: true,  level: 3 },
            { name: 'Bạch Hổ',    good: false, level: 10 },
            { name: 'Ngọc Đường', good: true,  level: 4 },
            { name: 'Thiên Lao',  good: false, level: 8 },
            { name: 'Huyền Vũ',   good: false, level: 9 },
            { name: 'Tư Mệnh',    good: true,  level: 5 },
            { name: 'Câu Trần',   good: false, level: 11 } // hung nhất
        ];

        // Giờ khởi đầu của Thanh Long theo Can ngày (quy tắc "Thanh Long khởi thời"):
        // Giáp/Kỷ -> Tý(0), Ất/Canh -> Dần(2), Bính/Tân -> Thìn(4), Đinh/Nhâm -> Ngọ(6), Mậu/Quý -> Thân(8)
        const THANH_LONG_START = { 0: 0, 5: 0, 1: 2, 6: 2, 2: 4, 7: 4, 3: 6, 8: 6, 4: 8, 9: 8 };

        function getGioStarInfo(dayGanIdx, chiIdx) {
            const start = (THANH_LONG_START[dayGanIdx] !== undefined) ? THANH_LONG_START[dayGanIdx] : 0;
            const pos = ((chiIdx - start) % 12 + 12) % 12;
            return HOANG_HAC_STARS[pos];
        }

        function getGioBackgroundColor(level) {
            const colors = [
                '#00a040', '#1aa848', '#34b050', '#4eb858', '#68c060', '#82c868', // 0-5 xanh (tốt, đậm -> nhạt)
                '#d8786a', '#c85a5c', '#b83c4e', '#a81e40', '#980832', '#880024' // 6-11 đỏ (xấu, nhạt -> đậm)
            ];
            return colors[Math.min(Math.max(level, 0), colors.length - 1)] || '#2a4a7a';
        }

        function renderGioCompact(dayGanIdx) {
            const chi = ['Tý', 'Sửu', 'Dần', 'Mão', 'Thìn', 'Tỵ', 'Ngọ', 'Mùi', 'Thân', 'Dậu', 'Tuất', 'Hợi'];
            const selectedHour = parseInt(document.getElementById('duongHour').value) || 0;
            const currentChi = Math.floor((selectedHour + 1) / 2) % 12;

            let container = document.getElementById('gioCompact');
            let html = '<table class="gio-table"><tr>';
            for (let i = 0; i < 12; i++) {
                const star = getGioStarInfo(dayGanIdx, i);
                const isHoang = star.good;
                const bg = getGioBackgroundColor(star.level);
                const border = isHoang ? '#2ecc71' : '#e74c3c';
                const emoji = GiapEmoji[i];
                const tenChi = chi[i];
                const gioBD = GioBatDau[i];
                const gioEnd = GioBatDau[(i + 1) % 12];
                const isNow = (i === currentChi);
                html += `<td class="gio-item-mini${isNow ? ' now' : ''}" style="background:${bg}; border-color:${border};" onclick="chonGio(${i})" title="${tenChi} - ${star.name} (${isHoang?'Hoàng Đạo':'Hắc Đạo'})${isNow?' - GIỜ HIỆN TẠI':''}">
                            <span class="line1"><span class="gio-emoji">${emoji}</span><span class="gio-ten"> ${tenChi}</span></span>
                            <span class="line2"><span class="gio-bd">${gioBD}</span><span class="gio-end"> - ${gioEnd}</span></span>
                        </td>`;
            }
            html += '</tr></table>';
            container.innerHTML = html;
        }

        // ================================================================
        // 7. ĐIỀU KHIỂN INPUT + DRAG + RESET
        // ================================================================
        document.getElementById('resetSun').addEventListener('click', layGioHienTai);
        document.getElementById('resetMoon').addEventListener('click', layGioHienTai);

        document.querySelectorAll('.val-input').forEach(input => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                const field = this.dataset.field;
                let val = parseInt(this.value) || 0;
                if (field === 'year') val = Math.max(1900, Math.min(2100, val));
                else if (field === 'month') val = Math.max(1, Math.min(12, val));
                else if (field === 'day') val = Math.max(1, Math.min(31, val));
                else if (field === 'hour') val = Math.max(0, Math.min(23, val));
                if (val !== parseInt(this.value)) this.value = String(val).padStart(2, '0');
                else if (this.value.length === 1 && field !== 'year') this.value = '0' + this.value;
            });

            input.addEventListener('change', function() {
                const field = this.dataset.field;
                let val = parseInt(this.value) || 0;
                if (field === 'year') val = Math.max(1900, Math.min(2100, val));
                else if (field === 'month') val = Math.max(1, Math.min(12, val));
                else if (field === 'day') val = Math.max(1, Math.min(31, val));
                else if (field === 'hour') val = Math.max(0, Math.min(23, val));
                this.value = (field === 'year') ? String(val) : String(val).padStart(2, '0');
                const isAm = this.id.startsWith('am');
                if (isAm) capNhatTuAm();
                else capNhatTuDuong();
            });

            // Drag
            let isDragging = false, startY = 0, startVal = 0;
            input.addEventListener('mousedown', function(e) {
                if (document.activeElement === this) return;
                isDragging = true;
                startY = e.clientY;
                startVal = parseInt(this.value) || 0;
                document.addEventListener('mousemove', onDragMove);
                document.addEventListener('mouseup', onDragEnd);
                e.preventDefault();
                this.style.borderColor = '#f7971e';
            });

            const onDragMove = (e) => {
                if (!isDragging) return;
                const deltaY = startY - e.clientY;
                const steps = Math.round(deltaY / 12);
                if (steps !== 0) {
                    let newVal = startVal + steps;
                    const field = input.dataset.field;
                    if (field === 'year') newVal = Math.max(1900, Math.min(2100, newVal));
                    else if (field === 'month') newVal = Math.max(1, Math.min(12, newVal));
                    else if (field === 'day') newVal = Math.max(1, Math.min(31, newVal));
                    else if (field === 'hour') newVal = Math.max(0, Math.min(23, newVal));
                    input.value = (field === 'year') ? String(newVal) : String(newVal).padStart(2, '0');
                    startVal = newVal;
                    startY = e.clientY;
                    const isAm = input.id.startsWith('am');
                    if (isAm) capNhatTuAm();
                    else capNhatTuDuong();
                }
            };

            const onDragEnd = () => {
                isDragging = false;
                input.style.borderColor = '#2a4a7a';
                document.removeEventListener('mousemove', onDragMove);
                document.removeEventListener('mouseup', onDragEnd);
            };
        });

        // ================================================================
        // 8. CẬP NHẬT
        // ================================================================
        function capNhatTuDuong() {
            const day = parseInt(document.getElementById('duongDay').value) || 1;
            const month = parseInt(document.getElementById('duongMonth').value) || 1;
            const year = parseInt(document.getElementById('duongYear').value) || 2024;
            const hour = parseInt(document.getElementById('duongHour').value) || 0;
            const date = new Date(year, month - 1, day, hour, 0, 0);
            if (isNaN(date.getTime())) return;

            const lunar = convertSolar2Lunar(day, month, year, 7.0);
            document.getElementById('amDay').value = String(lunar.day).padStart(2, '0');
            document.getElementById('amMonth').value = String(lunar.month).padStart(2, '0');
            document.getElementById('amYear').value = lunar.year;
            document.getElementById('amHour').value = String(hour).padStart(2, '0');
            document.getElementById('amNhuan').checked = lunar.leap === 1;

            const jd = jdFromDate(day, month, year);
            const dayInfo = getDayCanChi(jd);
            renderGioCompact(dayInfo.ganIdx);

            const cung = anBan(date);
            window._cungData = cung;
            if (cung) hienThiBan(cung);
        }

        function capNhatTuAm() {
            const day = parseInt(document.getElementById('amDay').value) || 1;
            const month = parseInt(document.getElementById('amMonth').value) || 1;
            const year = parseInt(document.getElementById('amYear').value) || 2024;
            const hour = parseInt(document.getElementById('amHour').value) || 0;
            const leap = document.getElementById('amNhuan').checked ? 1 : 0;

            const solar = convertLunar2Solar(day, month, year, leap, 7.0);
            if (!solar) {
                alert('Âm lịch không hợp lệ!');
                return;
            }
            document.getElementById('duongDay').value = String(solar.day).padStart(2, '0');
            document.getElementById('duongMonth').value = String(solar.month).padStart(2, '0');
            document.getElementById('duongYear').value = solar.year;
            document.getElementById('duongHour').value = String(hour).padStart(2, '0');

            const date = new Date(solar.year, solar.month - 1, solar.day, hour, 0, 0);
            const jd = jdFromDate(solar.day, solar.month, solar.year);
            const dayInfo = getDayCanChi(jd);
            renderGioCompact(dayInfo.ganIdx);

            const cung = anBan(date);
            window._cungData = cung;
            if (cung) hienThiBan(cung);
        }

        function layGioHienTai() {
            const now = new Date();
            document.getElementById('duongDay').value = String(now.getDate()).padStart(2, '0');
            document.getElementById('duongMonth').value = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('duongYear').value = now.getFullYear();
            document.getElementById('duongHour').value = String(now.getHours()).padStart(2, '0');
            capNhatTuDuong();
        }

        function chonGio(chiIndex) {
            let startHour = (chiIndex * 2 - 1) % 24;

            const gioIcon = document.getElementById('gioIcon');
            if (gioIcon) gioIcon.textContent = GiapEmoji[chiIndex];
            capNhatTuDuong();
        }

        function getDirection(h) {
            h = ((h % 360) + 360) % 360;
            if (h >= 337.5 || h < 22.5) return { name: 'Bắc', short: 'B', palace: 1, cung: 'Khảm' };
            if (h < 67.5) return { name: 'Đông Bắc', short: 'ĐB', palace: 8, cung: 'Cấn' };
            if (h < 112.5) return { name: 'Đông', short: 'Đ', palace: 3, cung: 'Chấn' };
            if (h < 157.5) return { name: 'Đông Nam', short: 'ĐN', palace: 4, cung: 'Tốn' };
            if (h < 202.5) return { name: 'Nam', short: 'N', palace: 9, cung: 'Ly' };
            if (h < 247.5) return { name: 'Tây Nam', short: 'TN', palace: 2, cung: 'Khôn' };
            if (h < 292.5) return { name: 'Tây', short: 'T', palace: 7, cung: 'Đoài' };
            return { name: 'Tây Bắc', short: 'TB', palace: 6, cung: 'Càn' };

        function taoChuDe(cfg, mon, tinh, than) {
            const parts = [['Môn', mon], ['Tinh', tinh], ['Thần', than]];
            let score = 0, good = [], bad = [];
            for (let i = 0; i < parts.length; i++) {
                const label = parts[i][0], name = parts[i][1];
                if (!name) continue;
                if (cfg.tot.indexOf(name) >= 0) { score++; good.push([label, name]); }
                else if (cfg.xau.indexOf(name) >= 0) { score--; bad.push([label, name]); }
            }
            let cls;
            if (score >= 1) cls = 'tot';
            else if (score <= -1) cls = 'xau';
            else cls = 'trung';
            function fmt(list, sign) {
                let s = '';
                for (let i = 0; i < list.length; i++) {
                    const nm = list[i][1];
                    const m = cfg.nghia && cfg.nghia[nm] ? cfg.nghia[nm] : '';
                    s += '<div class="cd-item"><span class="cd-sign">' + sign + '</span><b>' + list[i][0] + ' ' + nm + '</b>' + (m ? ': ' + m : '') + '</div>';
                }
                return s;
            }
            let detail = '';
            if (good.length) detail += fmt(good, '+');
            if (bad.length) detail += fmt(bad, '-');
            if (!good.length && !bad.length) detail = '<div class="cd-item">Không có thành phần đặc biệt tác động.</div>';
            return '<div class="cd-card ' + cls + '">'
                + '<div class="cd-head"><span class="cd-title ' + cls + '">' + cfg.emoji + ' ' + cfg.tieuDe + '</span></div>'
                + '<div class="cd-detail">' + detail + '</div>'

        }

        function danhGiaCung(mon, tinh, than) {
            let score = 0;
            if (mon === 'Sinh' || mon === 'Khai' || mon === 'Hưu') score += 1;
            else if (mon === 'Thương' || mon === 'Tử' || mon === 'Kinh') score -= 1;
            if (['Thiên Phụ', 'Thiên Cầm', 'Thiên Tâm', 'Thiên Nhậm'].indexOf(tinh) >= 0) score += 1;
            else if (['Thiên Bồng', 'Thiên Nhuế', 'Thiên Trụ'].indexOf(tinh) >= 0) score -= 1;
            if (['Trực Phù', 'Lục Hợp', 'Thái Âm', 'Cửu Địa', 'Cửu Thiên'].indexOf(than) >= 0) score += 0.5;
            else if (['Đằng Xà', 'Bạch Hổ', 'Huyền Vũ', 'Câu Trần', 'Chu Tước'].indexOf(than) >= 0) score -= 0.5;
            if (score >= 1.5) return { cls: 'tot', icon: '🟢', text: 'Hướng CÁT — thuận lợi, nên tận dụng', hung: false };
            if (score <= -0.5) return { cls: 'xau', icon: '🔴', text: 'Hướng HUNG — nên tránh hoặc hóa giải', hung: true };
            return { cls: 'trung', icon: '🟡', text: 'Hướng TRUNG — nên thận trọng, cân nhắc', hung: false };
        }

        // Trạng thái cát/hung của từng thành phần (Môn / Tinh / Thần)
        function componentStatus(type, name) {
            if (type === 'mon') {
                if (MON_TOT.indexOf(name) >= 0) return 'tot';
                if (MON_XAU.indexOf(name) >= 0) return 'xau';
                return 'trung';
            }
            if (type === 'tinh') {
                if (['Thiên Phụ', 'Thiên Cầm', 'Thiên Tâm', 'Thiên Nhậm'].indexOf(name) >= 0) return 'tot';
                if (['Thiên Bồng', 'Thiên Nhuế', 'Thiên Trụ'].indexOf(name) >= 0) return 'xau';
                return 'trung';
            }
            if (type === 'than') {
                if (['Trực Phù', 'Lục Hợp', 'Thái Âm', 'Cửu Địa', 'Cửu Thiên'].indexOf(name) >= 0) return 'tot';
                if (['Đằng Xà', 'Bạch Hổ', 'Huyền Vũ', 'Câu Trần', 'Chu Tước'].indexOf(name) >= 0) return 'xau';
                return 'trung';
            }
            return 'trung';
        }

        // Trọng số màu: tốt = +1, trung bình = 0, xấu = -1
        function componentWeight(type, name) {
            const st = componentStatus(type, name);
            return st === 'tot' ? 1 : (st === 'xau' ? -1 : 0);
        }

        // Trọng số của một chủ đề: +1 (thuận) / 0 (trung) / -1 (nghịch)
        function topicWeight(cfg, mon, tinh, than) {
            let s = 0;
            if (cfg.tot.indexOf(mon) >= 0) s++;
            else if (cfg.xau.indexOf(mon) >= 0) s--;
            if (cfg.tot.indexOf(tinh) >= 0) s++;
            else if (cfg.xau.indexOf(tinh) >= 0) s--;
            if (cfg.tot.indexOf(than) >= 0) s++;
            else if (cfg.xau.indexOf(than) >= 0) s--;
            return s >= 1 ? 1 : (s <= -1 ? -1 : 0);
        }

        // Các chủ đề tốt của cung hiện tại (chỉ liệt kê chủ đề thuận)
        function renderGoodTopics(cell) {
            if (!cell || !cell.mon) return '<tr><td class="ct" colspan="2">—</td></tr>';
            const mon = cell.mon, tinh = cell.tinh, than = cell.than;
            let html = '';
            for (let i = 0; i < CHU_DE.length; i++) {
                const cfg = CHU_DE[i];
                if (topicWeight(cfg, mon, tinh, than) >= 1) {
                    html += '<tr><td class="ci">' + cfg.emoji + '</td><td class="ct">' + cfg.tieuDe + '</td></tr>';
                }
            }
            if (html === '') html = '<tr><td class="ct" colspan="2">—</td></tr>';
            return html;
        }

        // Điểm tổng hợp của 1 cung: Môn + Tinh + Thần (môn/tinh/thần đã theo thời gian nên không cộng thêm giờ)
        function palaceScore(cell) {
            if (!cell.mon) return 0; // Trung cung (không có môn) -> trung tính
            let score = 0;
            score += componentWeight('mon', cell.mon);
            score += componentWeight('tinh', cell.tinh);
            score += componentWeight('than', cell.than);
            return score;
        }

        // Bảng màu: xanh đậm (tốt nhất) -> vàng (0) -> đỏ đậm (xấu nhất)
        // Chuẩn hoá điểm về thang -10..+10 (điểm thô -4..+4 = Môn + Tinh + Thần + Giờ)
        function normalizeScore(score) {
            return Math.round(score * 2.5);
        }

        // Màu theo trạng thái (dùng chung cho nút, vòng la bàn, ô trung tâm)
        function scoreStyle(scoreCls) {
            if (scoreCls === 'diem-tot') return { bg: 'rgba(46, 204, 113, 0.28)', bd: '#2ecc71', glow: 'rgba(46, 204, 113, 0.45)', txt: '#7bed9f' };
            if (scoreCls === 'diem-xau') return { bg: 'rgba(231, 76, 60, 0.28)', bd: '#e74c3c', glow: 'rgba(231, 76, 60, 0.45)', txt: '#ff6b6b' };
            return { bg: '#1a1a4a', bd: '#f1c40f', glow: 'rgba(241, 196, 15, 0.40)', txt: '#c8c8d0' };
        }

        // Tổng hợp thông tin cung hiện tại: điểm trọng số + ngũ hành thịnh/suy
        function headingInfo(cung) {
            const h = window._compass.heading;
            const dir = getDirection(h);
            const cell = (cung && cung[dir.palace]) ? cung[dir.palace] : null;
            let scoreText = '0', scoreCls = 'diem-trung', score10 = 0, summary = '', gioHTML = '', topicsHTML = '';
            if (cung && cell) {
                const chiIndex = cung.info.gioChi;
                const emoji = GiapEmoji[chiIndex];
                const tenChi = CHI[chiIndex];
                score10 = normalizeScore(palaceScore(cell));
                scoreText = (score10 > 0 ? '+' : '') + score10;
                scoreCls = score10 > 0 ? 'diem-tot' : (score10 < 0 ? 'diem-xau' : 'diem-trung');
                const p = phanTichNguHanh(dir.palace, cell);
                summary = renderNguHanhSummary(p);
                topicsHTML = renderGoodTopics(cell);
                gioHTML = '<span>' + emoji + '</span><span class="gio-txt">' + tenChi + '</span>';
            }
            return { h: h, dir: dir, cell: cell, scoreText: scoreText, scoreCls: scoreCls, score10: score10, summary: summary, gioHTML: gioHTML, topicsHTML: topicsHTML };
        }

        // Phân tích ngũ hành thịnh/suy của cung hiện tại:
        // đếm ngũ hành của Cung + Môn + Tinh + Thần (không dùng thời gian).
        function phanTichNguHanh(palaceIdx, cell) {
            const count = { 'Kim': 0, 'Mộc': 0, 'Thủy': 0, 'Hỏa': 0, 'Thổ': 0 };
            const add = function (h) { if (h && count[h] !== undefined) count[h]++; };
            add(CUNG_HANH[palaceIdx]);  // cung
            if (cell) {
                add(MON_LUAN[cell.mon] ? MON_LUAN[cell.mon].hanh : '');
                add(TINH_LUAN[cell.tinh] ? TINH_LUAN[cell.tinh].hanh : '');
                add(THAN_HANH[cell.than]);
            }
            return { count: count };
        }

        function renderNguHanhSummary(p) {
            return NGU_HANH_ORDER.map(function (k) {
                return (HANH_ICON[k] || '') + ' ' + k + (p.count[k] > 0 ? ' (' + p.count[k] + ')' : '');
            }).join(', ');
        }

        // Cập nhật ô trung tâm (Trung cung): hướng + điểm + ngũ hành thịnh/khuyết
        function updateCenterCell(cung) {
            const grid = document.querySelectorAll('#board .grid')[0];
            if (!grid || !grid.querySelectorAll) return;
            const cells = grid.querySelectorAll('.cell');
            if (!cells || cells.length < 5) return;
            const center = cells[4]; // Trung cung ở vị trí thứ 5 trong gridOrder [4,9,2,3,5,7,8,1,6]
            const hi = headingInfo(cung);
            const st = scoreStyle(hi.scoreCls);
            center.style.background = st.bg;
            center.style.borderColor = st.bd;
            const inner = center.querySelector('.cell-inner');
            if (inner) {
                inner.innerHTML = '<table class="cell-table">'
                    + hi.topicsHTML
                    + '</table>';
                inner.style.color = st.txt;
            }
        }

        // Màu nhạt: xanh (tốt) -> trung tính -> đỏ (xấu), không dùng màu vàng
        function scoreToColor(score) {
            const s = Math.max(-6, Math.min(6, Math.round(score)));
            if (s === 0) return '#2e2e3c';
            if (s > 0) return 'hsl(135, 38%, ' + (40 - s * 2) + '%)';
            return 'hsl(0, 45%, ' + (40 + s * 2) + '%)';
        }

        function renderLuanGiai(dir, cell) {
            const box = document.getElementById('compassLuanGiai');
            if (!box) return;
            const hanhCung = CUNG_HANH[dir.palace] || '';
            const cungChat = CUNG_LUAN[dir.palace] || '';
            const mon = cell ? (cell.mon || '') : '';
            const tinh = cell ? (cell.tinh || '') : '';
            const than = cell ? (cell.than || '') : '';
            const monInfo = MON_LUAN[mon] || null;
            const tinhInfo = TINH_LUAN[tinh] || null;
            const thanInfo = THAN_LUAN[than] || null;

            let html = '';
            html += '<div class="lg-grid">';

            // 4 ô bản chất (tô màu theo trạng thái)
            const stCung = 'trung';
            const stMon = componentStatus('mon', mon);
            const stTinh = componentStatus('tinh', tinh);
            const stThan = componentStatus('than', than);
            const iconCung = HANH_ICON[hanhCung] || '';
            const iconMon = monInfo ? (HANH_ICON[monInfo.hanh] || '') : '';
            const iconTinh = tinhInfo ? (HANH_ICON[tinhInfo.hanh] || '') : '';
            const iconThan = HANH_ICON[THAN_HANH[than]] || '';
            html += '<div class="lg-item ' + stCung + '"><span class="lg-tag">' + iconCung + ' Cung ' + dir.cung + '</span><br>' + cungChat + '</div>';
            html += '<div class="lg-item ' + stMon + '">' + (monInfo ? ('<span class="lg-tag">' + iconMon + ' Môn ' + mon + '</span><br>' + monInfo.chat) : '') + '</div>';
            html += '<div class="lg-item ' + stTinh + '">' + (tinhInfo ? ('<span class="lg-tag">' + iconTinh + ' Tinh ' + tinh + '</span><br>' + tinhInfo.chat) : '') + '</div>';
            html += '<div class="lg-item ' + stThan + '">' + (thanInfo ? ('<span class="lg-tag">' + iconThan + ' Thần ' + than + '</span><br>' + thanInfo) : '') + '</div>';

            // 8 chủ đề lớn
            for (let i = 0; i < CHU_DE.length; i++) {
                html += taoChuDe(CHU_DE[i], mon, tinh, than);
            }

            html += '</div>';

            box.innerHTML = html;
        }

        // Xoay bàn: "Bắc" (Khảm) của bàn luôn hướng về Bắc thực tế.
        // Bố cục truyền thống: Bắc ở đáy (180°); bản đồ: Bắc ở đỉnh (0°).
        function applyCompassRotation() {
            const grid = document.querySelectorAll('#board .grid')[0];
            if (!grid) return;
            // Luôn dùng rotation (giữ nguyên vị trí khi đóng la bàn)
            const angle = window._compass.rotation;
            grid.style.transform = 'rotate(' + angle + 'deg)';
            // Xoay ngược nội dung để chữ luôn thẳng, đọc được
            const inners = grid.querySelectorAll('.cell-inner');
            for (let i = 0; i < inners.length; i++) {
                inners[i].style.transform = 'rotate(' + (-angle) + 'deg)';
            }
            // Nhãn 8 hướng ở ô trung tâm: xoay như la bàn, chữ luôn thẳng đứng
            const heading = window._compass.heading;
            const dirs = grid.querySelectorAll('.center-dirs');
            for (let i = 0; i < dirs.length; i++) {
                dirs[i].style.transform = 'rotate(180deg)';
            }
            const cdirs = grid.querySelectorAll('.center-dirs .cdir');
            for (let i = 0; i < cdirs.length; i++) {
                cdirs[i].style.transform = 'translate(-50%, -50%) rotate(' + heading + 'deg)';
            }
        }

        function updateCompass() {
            const hi = headingInfo(window._cungData);
            const h = hi.h, dir = hi.dir, cell = hi.cell;
            const scoreText = hi.scoreText, scoreCls = hi.scoreCls;
            const st = scoreStyle(scoreCls);

            document.getElementById('compassDeg').textContent = h + '°';
            document.getElementById('compassDir').textContent = dir.name;
            document.getElementById('headingVal').textContent = h + '°';
            document.getElementById('headingSlider').value = h;

            // Dòng 1 la bàn: <Giờ> <độ, hướng> <điểm> — cùng màu theo trọng số
            const heading = document.getElementById('compassHeading');
            if (heading) heading.className = 'compass-heading ' + scoreCls;
            const gioEl = document.getElementById('compassGio');
            if (gioEl) gioEl.innerHTML = hi.gioHTML;
            const diem = document.getElementById('compassDiem');
            if (diem) {
                diem.textContent = scoreText;
                diem.className = 'diem-heading ' + scoreCls;
            }

            // Vòng la bàn tô màu theo trọng số
            const rose = document.getElementById('rose');
            if (rose && rose.style) {
                rose.style.background = st.bg;
                rose.style.borderColor = st.bd;
                rose.style.boxShadow = '0 0 24px ' + st.glow;
            }

            // Đồng bộ slider giờ + icon con giáp
            if (window._cungData && window._cungData.info) {
                const gioChi = window._cungData.info.gioChi;
                const gioSlider = document.getElementById('gioSlider');
                if (gioSlider) gioSlider.value = gioChi;
                const gioIcon = document.getElementById('gioIcon');
                if (gioIcon) gioIcon.textContent = GiapEmoji[gioChi];
            }

            // Tổng hợp ngũ hành thịnh/khuyết
            document.getElementById('compassPalace').textContent = hi.summary;
            renderLuanGiai(dir, cell);

            // Cập nhật ô trung tâm (hướng hiện tại + điểm + ngũ hành)
            updateCenterCell(window._cungData);

            // Xoay mặt la bàn: nhãn N luôn chỉ về Bắc thực
            const ring = document.getElementById('roseRing');
            if (ring) {
                ring.style.transform = 'rotate(' + (-h) + 'deg)';
                // Chống xoay chữ: giữ nhãn hướng (N, NE, E...) luôn thẳng đứng
                if (ring.querySelectorAll) {
                    const labels = ring.querySelectorAll('.rose-label');
                    for (let i = 0; i < labels.length; i++) {
                        labels[i].style.transform = 'translate(-50%, -50%) rotate(' + h + 'deg)';
                    }
                }
            }
            applyCompassRotation();
        }

        // ---- La bàn thực: cảm biến định hướng (từ kế + con quay hồi chuyển) ----
        function setStatus(live, text) {
            const el = document.getElementById('compassStatus');
            if (!el) return;
            el.textContent = text || '';
            el.className = 'compass-status' + (live ? ' live' : '');
        }

        // Chuẩn hoá + áp heading (0–359) từ cảm biến
        function setHeading(h) {
            if (typeof h !== 'number' || isNaN(h)) return;
            h = ((h % 360) + 360) % 360;
            window._compass.heading = Math.round(h);
            window._compass.rotation = -window._compass.heading - 180;
            window._compass.active = true;
            updateCompass();
        }

        // iOS Safari: webkitCompassHeading (0 = Bắc, tăng theo chiều kim đồng hồ)
        function onDeviceOrientation(e) {
            if (window._compass.manual) return;
            if (typeof e.webkitCompassHeading === 'number') {
                setHeading(e.webkitCompassHeading);
            } else if (e.absolute === true && typeof e.alpha === 'number') {
                setHeading(360 - e.alpha);
            }
        }

        // Android Chrome/Firefox: deviceorientationabsolute (alpha: 0 = Bắc, ngược chiều kim)
        function onDeviceOrientationAbsolute(e) {
            if (window._compass.manual) return;
            if (typeof e.alpha === 'number') {
                setHeading(360 - e.alpha);
            }
        }

        // Android: Generic Sensor API (AbsoluteOrientationSensor) — dự phòng
        function startAbsoluteSensor() {
            if (typeof AbsoluteOrientationSensor === 'undefined') return false;
            try {
                const sensor = new AbsoluteOrientationSensor({ frequency: 30 });
                sensor.addEventListener('reading', function () {
                    if (window._compass.manual) return;
                    const q = sensor.quaternion;
                    if (!q) return;
                    const yaw = Math.atan2(2 * (q[3] * q[2] + q[0] * q[1]), 1 - 2 * (q[1] * q[1] + q[2] * q[2]));
                    setHeading((yaw * 180 / Math.PI + 360) % 360);
                });
                sensor.addEventListener('error', function () {});
                sensor.start();
                window._compass.sensor = sensor;
                return true;
            } catch (err) {
                return false;
            }
        }

        // Bật la bàn (gọi khi người dùng MỞ la bàn)
        function startCompass() {
            if (window._compass.listening) return;
            window._compass.listening = true;
            window.addEventListener('deviceorientation', onDeviceOrientation, true);
            window.addEventListener('deviceorientationabsolute', onDeviceOrientationAbsolute, true);
            startAbsoluteSensor();
        }

        // Tắt la bàn (gọi khi ĐÓNG la bàn)
        function stopCompass() {
            window._compass.listening = false;
            window.removeEventListener('deviceorientation', onDeviceOrientation, true);
            window.removeEventListener('deviceorientationabsolute', onDeviceOrientationAbsolute, true);
            if (window._compass.sensor) {
                try { window._compass.sensor.stop(); } catch (e) {}
                window._compass.sensor = null;
            }
            window._compass.active = false;
            setStatus(false, '');
            updateCompass();
        }

        // ---- Mở / đóng la bàn + xin quyền iOS ----
        const roseEl = document.getElementById('rose');
        const compassLuanGiai = document.getElementById('compassLuanGiai');
        let compassOpen = false;

        function openCompass() {
            compassOpen = true;
            if (compassLuanGiai) compassLuanGiai.classList.remove('hidden');
            if (roseEl) {
                roseEl.classList.add('active');
            }
            // iOS cần xin quyền cảm biến trong một cử chỉ người dùng
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(function (state) {
                    if (state === 'granted') startCompass();
                    else setStatus(false, 'Chưa cấp quyền cảm biến (vào Settings)');
                }).catch(function () { setStatus(false, 'Không cấp được quyền cảm biến'); });
            } else {
                startCompass(); // Android/desktop không cần xin quyền
            }
        }

        function closeCompass() {
            compassOpen = false;
            if (compassLuanGiai) compassLuanGiai.classList.add('hidden');
            if (roseEl) {
                roseEl.classList.remove('active');
            }
            // KHÔNG stopCompass(): giữ cảm biến chạy để 9 vòng tròn vẫn xoay theo khi điện thoại di chuyển
        }

        if (roseEl) {
            roseEl.addEventListener('click', function () {
                if (compassOpen) closeCompass();
                else openCompass();
            });
        }

        // Xoay thử (khi mở trên máy tính không có la bàn)
        document.getElementById('headingSlider').addEventListener('input', function () {
            window._compass.manual = true;
            window._compass.heading = parseInt(this.value, 10) || 0;
            window._compass.rotation = -window._compass.heading - 180;
            window._compass.active = true;                  // xoay thủ công
            updateCompass();
        });
        // Slider canh giờ: kéo đổi giờ (thủ công), icon con giáp theo dõi ở cuối
        document.getElementById('gioSlider').addEventListener('input', function () {
            window._compass.manual = true;
            const chiIndex = parseInt(this.value, 10) || 0;
            document.getElementById('gioIcon').textContent = GiapEmoji[chiIndex];
            chonGio(chiIndex);
        });

        // Kéo thả chuột (hoặc chạm) để xoay bàn theo hướng mong muốn
        function initBoardDrag() {
            const board = document.getElementById('board');
            if (!board || !board.addEventListener) return;
            let dragging = false, startAngle = 0, startHeading = 0;

            function pointerAngle(clientX, clientY) {
                const rect = board.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                return Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI;
            }
            function onStart(clientX, clientY) {
                dragging = true;
                window._compass.manual = true;
                startAngle = pointerAngle(clientX, clientY);
                startHeading = window._compass.heading;
            }
            function onMove(clientX, clientY) {
                if (!dragging) return;
                const a = pointerAngle(clientX, clientY);
                let delta = a - startAngle;
                delta = ((delta + 180) % 360 + 360) % 360 - 180;
                setHeading(startHeading - delta);
            }
            function onEnd() {
                if (!dragging) return;
                dragging = false;
                window._compass.manual = false;
                // Tự động chọn lại giờ hiện tại khi thao tác vào các vòng tròn
                const now = new Date();
                const hourInput = document.getElementById('duongHour');
                if (hourInput) hourInput.value = String(now.getHours()).padStart(2, '0');
                capNhatTuDuong();
            }

            board.addEventListener('mousedown', function (e) { onStart(e.clientX, e.clientY); if (e.preventDefault) e.preventDefault(); });
            board.addEventListener('touchstart', function (e) { onStart(e.touches[0].clientX, e.touches[0].clientY); if (e.preventDefault) e.preventDefault(); }, { passive: false });

            if (document.addEventListener) {
                document.addEventListener('mousemove', function (e) { onMove(e.clientX, e.clientY); });
                document.addEventListener('mouseup', onEnd);
                document.addEventListener('touchmove', function (e) { onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
                document.addEventListener('touchend', onEnd);
            }
        }
        initBoardDrag();

        updateCompass();

        window.onload = function() {
            layGioHienTai();
            updateCompass();
        };
    </script>
