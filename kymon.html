        function capNhatTuDuong() {
            const day = parseInt(document.getElementById('duongDay').value) || 1;
            const month = parseInt(document.getElementById('duongMonth').value) || 1;
            const year = parseInt(document.getElementById('duongYear').value) || 2024;
            const hour = parseInt(document.getElementById('duongHour').value) || 0;
            const date = new Date(year, month - 1, day, hour, 0, 0);
            if (isNaN(date.getTime())) return;

            const lunar = convertSolar2Lunar(day, month, year, 7.0);
            document.getElementById('amDay').value = String(lunar.day).padStart(2, '0');
            document.getElementById('amMonth').value = String(lunar.month).padStart(2, '0');
            document.getElementById('amYear').value = lunar.year;
            document.getElementById('amHour').value = String(hour).padStart(2, '0');
            document.getElementById('amNhuan').checked = lunar.leap === 1;

            const jd = jdFromDate(day, month, year);
            const dayInfo = getDayCanChi(jd);
            renderGioCompact(dayInfo.ganIdx);

            const cung = anBan(date);
            window._cungData = cung;
            if (cung) hienThiBan(cung);
        }

        function capNhatTuAm() {
            const day = parseInt(document.getElementById('amDay').value) || 1;
            const month = parseInt(document.getElementById('amMonth').value) || 1;
            const year = parseInt(document.getElementById('amYear').value) || 2024;
            const hour = parseInt(document.getElementById('amHour').value) || 0;
            const leap = document.getElementById('amNhuan').checked ? 1 : 0;

            const solar = convertLunar2Solar(day, month, year, leap, 7.0);
            if (!solar) {
                alert('Âm lịch không hợp lệ!');
                return;
            }
            document.getElementById('duongDay').value = String(solar.day).padStart(2, '0');
            document.getElementById('duongMonth').value = String(solar.month).padStart(2, '0');
            document.getElementById('duongYear').value = solar.year;
            document.getElementById('duongHour').value = String(hour).padStart(2, '0');

            const date = new Date(solar.year, solar.month - 1, solar.day, hour, 0, 0);
            const jd = jdFromDate(solar.day, solar.month, solar.year);
            const dayInfo = getDayCanChi(jd);
            renderGioCompact(dayInfo.ganIdx);

            const cung = anBan(date);
            window._cungData = cung;
            if (cung) hienThiBan(cung);
        }

            if (h < 202.5) return { name: 'Nam', short: 'N', palace: 9, cung: 'Ly' };

            const parts = [['Môn', mon], ['Tinh', tinh], ['Thần', than]];
            let score = 0, good = [], bad = [];
            for (let i = 0; i < parts.length; i++) {
                const label = parts[i][0], name = parts[i][1];
                if (!name) continue;
                if (cfg.tot.indexOf(name) >= 0) { score++; good.push([label, name]); }
                else if (cfg.xau.indexOf(name) >= 0) { score--; bad.push([label, name]); }
            }
            let cls;
            if (score >= 1) cls = 'tot';
            else if (score <= -1) cls = 'xau';
            else cls = 'trung';
            function fmt(list, sign) {
                let s = '';
                for (let i = 0; i < list.length; i++) {
                    const nm = list[i][1];
                    const m = cfg.nghia && cfg.nghia[nm] ? cfg.nghia[nm] : '';
                    s += '<div class="cd-item"><span class="cd-sign">' + sign + '</span><b>' + list[i][0] + ' ' + nm + '</b>' + (m ? ': ' + m : '') + '</div>';
                }
                return s;
            }
            let detail = '';
            if (good.length) detail += fmt(good, '+');
            if (bad.length) detail += fmt(bad, '-');
            if (!good.length && !bad.length) detail = '<div class="cd-item">Không có thành phần đặc biệt tác động.</div>';
            return '<div class="cd-card ' + cls + '">'
                + '<div class="cd-head"><span class="cd-title ' + cls + '">' + cfg.emoji + ' ' + cfg.tieuDe + '</span></div>'

        function danhGiaCung(mon, tinh, than) {
            let score = 0;
            if (mon === 'Sinh' || mon === 'Khai' || mon === 'Hưu') score += 1;
            else if (mon === 'Thương' || mon === 'Tử' || mon === 'Kinh') score -= 1;
            if (['Thiên Phụ', 'Thiên Cầm', 'Thiên Tâm', 'Thiên Nhậm'].indexOf(tinh) >= 0) score += 1;
            else if (['Thiên Bồng', 'Thiên Nhuế', 'Thiên Trụ'].indexOf(tinh) >= 0) score -= 1;
            if (['Trực Phù', 'Lục Hợp', 'Thái Âm', 'Cửu Địa', 'Cửu Thiên'].indexOf(than) >= 0) score += 0.5;
            else if (['Đằng Xà', 'Bạch Hổ', 'Huyền Vũ', 'Câu Trần', 'Chu Tước'].indexOf(than) >= 0) score -= 0.5;
            if (score >= 1.5) return { cls: 'tot', icon: '🟢', text: 'Hướng CÁT — thuận lợi, nên tận dụng', hung: false };
            if (score <= -0.5) return { cls: 'xau', icon: '🔴', text: 'Hướng HUNG — nên tránh hoặc hóa giải', hung: true };
            return { cls: 'trung', icon: '🟡', text: 'Hướng TRUNG — nên thận trọng, cân nhắc', hung: false };
        }

        // Trạng thái cát/hung của từng thành phần (Môn / Tinh / Thần)
        function componentStatus(type, name) {
            if (type === 'mon') {
                if (MON_TOT.indexOf(name) >= 0) return 'tot';
                if (MON_XAU.indexOf(name) >= 0) return 'xau';
                return 'trung';
            }
            if (type === 'tinh') {
                if (['Thiên Phụ', 'Thiên Cầm', 'Thiên Tâm', 'Thiên Nhậm'].indexOf(name) >= 0) return 'tot';
                if (['Thiên Bồng', 'Thiên Nhuế', 'Thiên Trụ'].indexOf(name) >= 0) return 'xau';
                return 'trung';
            }
            if (type === 'than') {
                if (['Trực Phù', 'Lục Hợp', 'Thái Âm', 'Cửu Địa', 'Cửu Thiên'].indexOf(name) >= 0) return 'tot';
                if (['Đằng Xà', 'Bạch Hổ', 'Huyền Vũ', 'Câu Trần', 'Chu Tước'].indexOf(name) >= 0) return 'xau';
                return 'trung';
            }
            return 'trung';
        }

        // Trọng số màu: tốt = +1, trung bình = 0, xấu = -1
        function componentWeight(type, name) {
            const st = componentStatus(type, name);
            return st === 'tot' ? 1 : (st === 'xau' ? -1 : 0);
        }

        // Trọng số của một chủ đề: +1 (thuận) / 0 (trung) / -1 (nghịch)
        function topicWeight(cfg, mon, tinh, than) {
            let s = 0;
            if (cfg.tot.indexOf(mon) >= 0) s++;
            else if (cfg.xau.indexOf(mon) >= 0) s--;
            if (cfg.tot.indexOf(tinh) >= 0) s++;
            else if (cfg.xau.indexOf(tinh) >= 0) s--;
            if (cfg.tot.indexOf(than) >= 0) s++;
            else if (cfg.xau.indexOf(than) >= 0) s--;
            return s >= 1 ? 1 : (s <= -1 ? -1 : 0);
        }

        // Các chủ đề tốt của cung hiện tại (chỉ liệt kê chủ đề thuận)
        function renderGoodTopics(cell) {
            if (!cell || !cell.mon) return '<tr><td class="ct" colspan="2">—</td></tr>';
            const mon = cell.mon, tinh = cell.tinh, than = cell.than;
            let html = '';
            for (let i = 0; i < CHU_DE.length; i++) {
                const cfg = CHU_DE[i];
                if (topicWeight(cfg, mon, tinh, than) >= 1) {
                    html += '<tr><td class="ci">' + cfg.emoji + '</td><td class="ct">' + cfg.tieuDe + '</td></tr>';
                }
            }
            if (html === '') html = '<tr><td class="ct" colspan="2">—</td></tr>';
            return html;
        }

        // Điểm tổng hợp của 1 cung: Môn + Tinh + Thần (môn/tinh/thần đã theo thời gian nên không cộng thêm giờ)
        // ⚠️ LEGACY HEURISTIC SCORE — chỉ dùng cho màu hiển thị UI (backward compatibility).
        // Interpretation Engine (KYMON_IQ) KHÔNG gọi hàm này; điểm này KHÔNG phải xác suất.
        function palaceScore(cell) {
            if (!cell.mon) return 0; // Trung cung (không có môn) -> trung tính
            let score = 0;
            score += componentWeight('mon', cell.mon);
            score += componentWeight('tinh', cell.tinh);
            score += componentWeight('than', cell.than);
            return score;
        }

        // Deprecated compatibility layer — UI display only (alias của palaceScore).
        const legacyHeuristicScore = palaceScore;

        // Bảng màu: xanh đậm (tốt nhất) -> vàng (0) -> đỏ đậm (xấu nhất)
        // Chuẩn hoá điểm về thang -10..+10 (điểm thô -4..+4 = Môn + Tinh + Thần + Giờ)
        function normalizeScore(score) {
            return Math.round(score * 2.5);
        }

        // Màu theo trạng thái (dùng chung cho nút, vòng la bàn, ô trung tâm)
        function scoreStyle(scoreCls) {
            if (scoreCls === 'diem-tot') return { bg: 'rgba(46, 204, 113, 0.28)', bd: '#2ecc71', glow: 'rgba(46, 204, 113, 0.45)', txt: '#7bed9f' };
            if (scoreCls === 'diem-xau') return { bg: 'rgba(231, 76, 60, 0.28)', bd: '#e74c3c', glow: 'rgba(231, 76, 60, 0.45)', txt: '#ff6b6b' };
            return { bg: '#1a1a4a', bd: '#f1c40f', glow: 'rgba(241, 196, 15, 0.40)', txt: '#c8c8d0' };
        }

        // Tổng hợp thông tin cung hiện tại: điểm trọng số + ngũ hành thịnh/suy
        function headingInfo(cung) {
            const h = window._compass.heading;
            const dir = getDirection(h);
            const cell = (cung && cung[dir.palace]) ? cung[dir.palace] : null;
            let scoreText = '0', scoreCls = 'diem-trung', score10 = 0, summary = '', gioHTML = '', topicsHTML = '';
            if (cung && cell) {
                const chiIndex = cung.info.gioChi;
                const emoji = GiapEmoji[chiIndex];
                const tenChi = CHI[chiIndex];
                score10 = normalizeScore(palaceScore(cell));
                scoreText = (score10 > 0 ? '+' : '') + score10;
                scoreCls = score10 > 0 ? 'diem-tot' : (score10 < 0 ? 'diem-xau' : 'diem-trung');
                const p = phanTichNguHanh(dir.palace, cell);
                summary = renderNguHanhSummary(p);
                topicsHTML = renderGoodTopics(cell);
                gioHTML = '<span>' + emoji + '</span><span class="gio-txt">' + tenChi + '</span>';
            }
            return { h: h, dir: dir, cell: cell, scoreText: scoreText, scoreCls: scoreCls, score10: score10, summary: summary, gioHTML: gioHTML, topicsHTML: topicsHTML };
        }

        // Phân tích ngũ hành thịnh/suy của cung hiện tại:
        // đếm ngũ hành của Cung + Môn + Tinh + Thần (không dùng thời gian).
        function phanTichNguHanh(palaceIdx, cell) {
            const count = { 'Kim': 0, 'Mộc': 0, 'Thủy': 0, 'Hỏa': 0, 'Thổ': 0 };
            const add = function (h) { if (h && count[h] !== undefined) count[h]++; };
            add(CUNG_HANH[palaceIdx]);  // cung
            if (cell) {
                add(MON_LUAN[cell.mon] ? MON_LUAN[cell.mon].hanh : '');
                add(TINH_LUAN[cell.tinh] ? TINH_LUAN[cell.tinh].hanh : '');
                add(THAN_HANH[cell.than]);
            }
            return { count: count };
        }

        function renderNguHanhSummary(p) {
            return NGU_HANH_ORDER.map(function (k) {
                return (HANH_ICON[k] || '') + ' ' + k + (p.count[k] > 0 ? ' (' + p.count[k] + ')' : '');
            }).join(', ');
        }

        // Cập nhật ô trung tâm (Trung cung): hướng + điểm + ngũ hành thịnh/khuyết
        function updateCenterCell(cung) {
            const grid = document.querySelectorAll('#board .grid')[0];
            if (!grid || !grid.querySelectorAll) return;
            const cells = grid.querySelectorAll('.cell');
            if (!cells || cells.length < 5) return;
            const center = cells[4]; // Trung cung ở vị trí thứ 5 trong gridOrder [4,9,2,3,5,7,8,1,6]
            const hi = headingInfo(cung);
            const st = scoreStyle(hi.scoreCls);
            center.style.background = st.bg;
            center.style.borderColor = st.bd;
            const inner = center.querySelector('.cell-inner');
            if (inner) {
                inner.innerHTML = '<table class="cell-table">'
                    + iqCenterTopicsHTML(cung)
                    + '</table>';
                inner.style.color = st.txt;
            }
        }

        // Chủ đề THUẬN (điểm ≥ +1) tại hướng hiện tại — format CŨ 2 cột ở ô trung tâm:
        // cột 1 = icon, cột 2 = tên chủ đề kèm điểm (vd "Sự nghiệp +2"),
        // XẾP THEO ĐIỂM GIẢM DẦN (tới +1); chủ đề điểm < +1 (0/âm) KHÔNG trả về.
        let _iqCenterCache = null;
        function iqCenterTopicsHTML(cung) {
            if (!window.KYMON_IQ || !cung) return '<tr><td class="ct" colspan="2">—</td></tr>';
            const h = window._compass.heading;
            const dir = getDirection(h);
            const focusPalace = dir.palace;
            const key = 'c' + focusPalace + '|' + (cung.info && cung.info.date ? cung.info.date.toString() : '');
            if (_iqCenterCache && _iqCenterCache.key === key) return _iqCenterCache.html;
            const items = [];
            for (let i = 0; i < IQ_CELLS.length; i++) {
                const c = IQ_CELLS[i];
                let res = null;
                try { res = window.KYMON_IQ.interpretQimen(cung, { type: c.type, text: '' }, { focusPalace: focusPalace }); }
                catch (e) { continue; }
                let d = null;
                for (let j = 0; j < res.conclusion.dimensions.length; j++) {
                    if (res.conclusion.dimensions[j].dimension === c.dim) { d = res.conclusion.dimensions[j]; break; }
                }
                if (!d) d = res.conclusion.dimensions[0];
                const score = window.KYMON_IQ.topicScoreFromVerdict(
                    d ? d.direction : 'NEUTRAL', d ? d.intensity : 'WEAK');
                if (score >= 1) items.push({ emoji: c.emoji, label: c.label, score: score, order: i });
            }
            // Điểm CAO → THẤP; cùng điểm giữ nguyên thứ tự 16 chủ đề (sort ổn định)
            items.sort(function (a, b) { return (b.score - a.score) || (a.order - b.order); });
            let rows = '';
            for (let i = 0; i < items.length; i++) {
                const it = items[i];
                const scText = (it.score > 0 ? '+' : '') + it.score;
                rows += '<tr><td class="ci">' + it.emoji + '</td>'
                    + '<td class="ct">' + it.label + ' <span class="cs-s">' + scText + '</span></td></tr>';
            }
            if (!rows) rows = '<tr><td class="ct" colspan="2">—</td></tr>';
            _iqCenterCache = { key: key, html: rows };
            return rows;
        }

        // Màu nhạt: xanh (tốt) -> trung tính -> đỏ (xấu), không dùng màu vàng
        // Màu điểm −9..+9: càng cao càng XANH LÁ đậm, càng thấp càng ĐỎ đậm.
        // Giữ độ sáng 24–38% để chữ trắng vẫn đọc rõ trên nền đậm.
        function scoreToColor(score) {
            const s = Math.max(-9, Math.min(9, Math.round(score)));
            if (s === 0) return '#2e2e3c';
            const t = Math.abs(s) / 9;
            if (s > 0) return 'hsl(140, 52%, ' + Math.round(38 - 14 * t) + '%)';
            return 'hsl(0, 52%, ' + Math.round(38 - 14 * t) + '%)';
        }

        // Tô màu nền 8 nhãn hướng trên la bàn theo đúng màu nền (điểm) của 8 cung lớn tương ứng
        function updateRoseLabels(cung, sc) {
            const ring = document.getElementById('roseRing');
            if (!ring || !ring.querySelectorAll) return;
            const labels = ring.querySelectorAll('.rose-label');
            for (let i = 0; i < labels.length; i++) {
                const p = parseInt(labels[i].dataset.palace, 10);
                if (p >= 1 && p <= 9 && cung && cung[p]) {
                    const s10 = (sc && sc.per && sc.per[p] !== undefined) ? sc.per[p] : 0;
                    labels[i].style.background = scoreToColor(s10);
                    labels[i].style.color = '#ffffff';
                    labels[i].style.borderColor = HANH_COLOR[CUNG_HANH[p]] || '#2a4a7a';
                    const scoreSpan = labels[i].querySelector('.rl-score');
                    if (scoreSpan) scoreSpan.textContent = (s10 > 0 ? '+' : '') + s10;
                }
            }
        }

        // ================================================================
        // LUẬN GIẢI THEO HƯỚNG — Rule Engine (KYMON_IQ) — 12 ô chủ đề (3×4).
        // RÀNG BUỘC HƯỚNG: interpretation chạy trên CUNG ĐANG HƯỚNG TỚI
        // (focusPalace = dir.palace) → đổi hướng = đổi kết quả luận giải.
        // Chỉ hiển thị KẾT QUẢ — không hiển thị cách suy luận (trace/factors).
        // ================================================================
        // 9 chủ đề lớn (3 dòng × 3 cột) — gom từ 19 loại câu hỏi:
        //   Sự nghiệp ← CAREER, JOB_INTERVIEW, PROJECT, COMPETITION
        //   Tài lộc   ← WEALTH, REAL_ESTATE, INVESTMENT
        //   Kinh doanh ← BUSINESS, PARTNERSHIP
        //   Hôn nhân · Tình cảm ← MARRIAGE, LOVE
        //   Sức khỏe  ← HEALTH
        //   Học hành · Thi cử ← STUDY, EXAM
        //   Đi lại    ← TRAVEL
        //   Kiện tụng ← LITIGATION
        //   An toàn   ← SAFETY, LOST_OBJECT
        // 16 chủ đề (khớp lib/score.js TOPIC_CELLS) — lưới 4×4
        const IQ_CELLS = [
            { type: 'CAREER', dim: 'career', label: 'Sự nghiệp', emoji: '💼' },
            { type: 'WEALTH', dim: 'wealth', label: 'Tài lộc', emoji: '💰' },
            { type: 'BUSINESS', dim: 'wealth', label: 'Kinh doanh', emoji: '🏪' },
            { type: 'REAL_ESTATE', dim: 'wealth', label: 'Nhà đất', emoji: '🏠' },
            { type: 'PARTNERSHIP', dim: 'relationship', label: 'Hợp tác', emoji: '🤝' },
            { type: 'MARRIAGE', dim: 'relationship', label: 'Hôn nhân', emoji: '💍' }, // + LOVE
            { type: 'CHILDREN', dim: 'children', label: 'Con cái', emoji: '👶' },
            { type: 'HEALTH', dim: 'health', label: 'Sức khỏe', emoji: '🏥' },
            { type: 'STUDY', dim: 'study', label: 'Học hành', emoji: '📚' }, // + EXAM
            { type: 'REPUTATION', dim: 'reputation', label: 'Danh tiếng', emoji: '🏆' },
            { type: 'TRAVEL', dim: 'travel', label: 'Đi lại', emoji: '✈️' },
            { type: 'LITIGATION', dim: 'litigation', label: 'Kiện tụng', emoji: '⚖️' },
            { type: 'SAFETY', dim: 'safety', label: 'An toàn', emoji: '🛡️' },
            { type: 'LOST_OBJECT', dim: 'general', label: 'Tìm kiếm', emoji: '🔍' },
            { type: 'ENDING', dim: 'ending', label: 'Kết thúc', emoji: '🏁' },
            { type: 'SPIRITUAL', dim: 'spiritual', label: 'Tâm linh', emoji: '🕯️' }
        ];
        let _iqLastKey = null, _iqLastHtml = '';

        // Lý do dẫn tới kết luận của 1 chủ đề (từ findings — ngắn gọn, dễ đọc)
        function iqCellReasons(res, dim) {
            const fav = [], unfav = [];
            res.findings.forEach(function (f) {
                const relevant = f.dimensions === null || (Array.isArray(f.dimensions) && f.dimensions.indexOf(dim) >= 0);
                if (!relevant) return;
                if (f.priority === 100) return; // bỏ note Trung cung
                let txt = f.explanation || f.name;
                // Dịch chữ Trung → Việt cho dễ đọc
                txt = txt.split('用神').join('Dụng thần');
                // Tránh lặp subject khi explanation đã nhắc tới subject
                if (f.subject && txt.indexOf(f.subject) < 0) txt = f.subject + ' — ' + txt;
                if (txt.length > 140) txt = txt.slice(0, 137) + '…';
                // Viết hoa chữ cái đầu mỗi câu lý do (vd: can Kỷ → Can Kỷ)
                txt = txt.charAt(0).toUpperCase() + txt.slice(1);
                if (f.polarity === 'FAVORABLE' && fav.length < 2) fav.push(txt);
                else if (f.polarity === 'UNFAVORABLE' && unfav.length < 2) unfav.push(txt);
            });
            return { fav: fav, unfav: unfav };
        }

        function renderLuanGiai(dir, cell) {
            const box = document.getElementById('compassLuanGiai');
            if (!box) return;
            if (!window.KYMON_IQ || !window._cungData) { box.innerHTML = ''; return; }
            const chart = window._cungData;
            const focusPalace = dir.palace;
            // Cache: chỉ tính lại khi ĐỔI CUNG hướng hoặc ĐỔI NGÀY/GIỜ
            const key = focusPalace + '|' + (chart.info && chart.info.date ? chart.info.date.toString() : '');
            if (_iqLastKey === key) { box.innerHTML = _iqLastHtml; return; }
            _iqLastKey = key;

            // 9 ô chủ đề (3 dòng × 3 cột) — mỗi ô: kết quả + luận giải chi tiết
            let html = '<div class="lg-grid9">';
            for (let i = 0; i < IQ_CELLS.length; i++) {
                const c = IQ_CELLS[i];
                let res = null;
                try { res = window.KYMON_IQ.interpretQimen(chart, { type: c.type, text: '' }, { focusPalace: focusPalace }); }
                catch (e) { continue; }
                let d = null;
                for (let j = 0; j < res.conclusion.dimensions.length; j++) {
                    if (res.conclusion.dimensions[j].dimension === c.dim) { d = res.conclusion.dimensions[j]; break; }
                }
                if (!d) d = res.conclusion.dimensions[0] || { direction: 'NEUTRAL', intensity: 'WEAK' };
                const cls = d.direction === 'FAVORABLE' ? 'fav' : d.direction === 'UNFAVORABLE' ? 'unfav' : d.direction === 'MIXED' ? 'mix' : 'neu';
                // Điểm chủ đề −2..+2 (Thuận rõ +2, Thuận vừa +1, Không thuận vừa −1, Không thuận rõ −2)
                // Chỉ hiển thị SỐ ĐIỂM — bỏ từ chỉ mức độ (Thuận (rõ)/Không thuận (vừa)/Trái chiều...)
                const ts = window.KYMON_IQ.topicScoreFromVerdict(d.direction, d.intensity);
                const word = (ts > 0 ? '+' : '') + ts;
                const reasons = iqCellReasons(res, c.dim);
                // Màu nền ô theo ĐIỂM CHỦ ĐỀ RIÊNG của nó: +2 xanh đậm, −2 đỏ đậm, càng dương càng xanh, càng âm càng đỏ
                const cellBg = scoreToColor(ts * 4.5);
                html += '<div class="lg-cell ' + cls + '" style="background:' + cellBg + ';">'
                    + '<div class="lg-cell-top"><span class="lg-cell-emoji">' + c.emoji + '</span>'
                    + '<span class="lg-cell-name">' + c.label + '</span>'
                    + '<span class="lg-cell-word">' + word + '</span></div>'
                    + '<div class="lg-cell-detail">';
                if (reasons.fav.length) {
                    html += '<div class="lg-reason fav">' + reasons.fav.map(function (t) { return '• ' + t; }).join('</div><div class="lg-reason fav">') + '</div>';
                }
                if (reasons.unfav.length) {
                    html += '<div class="lg-reason unfav">' + reasons.unfav.map(function (t) { return '• ' + t; }).join('</div><div class="lg-reason unfav">') + '</div>';
                }
                if (!reasons.fav.length && !reasons.unfav.length) {
                    html += '<div class="lg-reason neu">• Không có yếu tố nổi bật — cân nhắc kỹ.</div>';
                }
                html += '</div></div>';
            }
            html += '</div>';

            _iqLastHtml = html;
            box.innerHTML = html;
        }

        // Xoay bàn: "Bắc" (Khảm) của bàn luôn hướng về Bắc thực tế.
        // Bố cục truyền thống: Bắc ở đáy (180°); bản đồ: Bắc ở đỉnh (0°).
        function applyCompassRotation() {
            const grid = document.querySelectorAll('#board .grid')[0];
            if (!grid) return;
            // Luôn dùng rotation (giữ nguyên vị trí khi đóng la bàn)
            const angle = window._compass.rotation;
            grid.style.transform = 'rotate(' + angle + 'deg)';
            // Xoay ngược nội dung để chữ luôn thẳng, đọc được
            const inners = grid.querySelectorAll('.cell-inner');
            for (let i = 0; i < inners.length; i++) {
                inners[i].style.transform = 'rotate(' + (-angle) + 'deg)';
            }
            // Nhãn 8 hướng ở ô trung tâm: xoay như la bàn, chữ luôn thẳng đứng
            const heading = window._compass.heading;
            const dirs = grid.querySelectorAll('.center-dirs');
            for (let i = 0; i < dirs.length; i++) {
                dirs[i].style.transform = 'rotate(180deg)';
            }
            const cdirs = grid.querySelectorAll('.center-dirs .cdir');
            for (let i = 0; i < cdirs.length; i++) {
                cdirs[i].style.transform = 'translate(-50%, -50%) rotate(' + heading + 'deg)';
            }
        }

        // Điểm −9..+9 (Rule Engine): cache theo lá số — chỉ tính lại khi đổi ngày/giờ.
        // Điểm HƯỚNG = round(Σ điểm 9 chủ đề ÷ 2); Điểm GIỜ = tổng tốt − tổng xấu của 8 hướng.
        function iqScores() {
            if (!window.KYMON_IQ || !window._cungData || !window._cungData.info) return null;
            const key = window._cungData.info.date ? window._cungData.info.date.toString() : '';
            let base = window._iqScoresCache;
            if (!base || base.key !== key) {
                const hs = window.KYMON_IQ.scoreHour(window._cungData);
                const per = {};
                [1, 2, 3, 4, 6, 7, 8, 9].forEach(function (p) {
                    per[p] = window.KYMON_IQ.scoreDirection(window._cungData, p).score;
                });
                base = { key: key, hourScore: hs.score, per: per };
                window._iqScoresCache = base;
            }
            return Object.assign({}, base);
        }

        function updateCompass() {
            const hi = headingInfo(window._cungData);
            const h = hi.h, dir = hi.dir, cell = hi.cell;
            document.getElementById('headingVal').textContent = h + '°';
            document.getElementById('headingSlider').value = h;

            // Điểm mới (Rule Engine −9..+9): điểm HƯỚNG + điểm GIỜ
            const sc = iqScores();
            const dirScore = (sc && sc.per[dir.palace] !== undefined) ? sc.per[dir.palace] : 0;
            const hourScore = sc ? sc.hourScore : 0;
            const scoreText = (dirScore > 0 ? '+' : '') + dirScore;
            const scoreCls = dirScore > 0 ? 'diem-tot' : (dirScore < 0 ? 'diem-xau' : 'diem-trung');

            // Dòng 1 la bàn (rút gọn): <độ>° Cung <cung> <hướng tt>, <Môn> Môn – Sao <Tinh> – Thần <Thần>
            // (bỏ tên hướng đầy đủ, giờ + điểm giờ, điểm cung — điểm vẫn ở tâm la bàn & 8 nhãn)
            const heading = document.getElementById('compassHeading');
            if (heading) {
                let line = h + '° Cung ' + dir.cung + ' ' + dir.short;
                if (cell) {
                    const parts = [];
                    if (cell.mon) parts.push(cell.mon + ' Môn');
                    if (cell.tinh) parts.push('Sao ' + cell.tinh);
                    if (cell.than) parts.push('Thần ' + cell.than);
                    if (parts.length) line += ', ' + parts.join(' – ');
                }
                heading.textContent = line;
                heading.className = 'compass-heading ' + scoreCls;
            }

            const diem = document.getElementById('compassDiem');
            if (diem) {
                diem.textContent = scoreText;
                diem.className = 'diem-heading ' + scoreCls;
            }

            // Vòng la bàn: màu theo điểm hướng (càng cao càng xanh đậm, càng thấp càng đỏ đậm)
            const rose = document.getElementById('rose');
            if (rose && rose.style) {
                rose.style.background = scoreToColor(dirScore);
                rose.style.borderColor = dirScore >= 0 ? '#2ecc71' : '#e74c3c';
                rose.style.boxShadow = '0 0 24px ' + (dirScore >= 0 ? 'rgba(46, 204, 113, 0.45)' : 'rgba(231, 76, 60, 0.45)');
            }

            // Tô màu nền 8 nhãn hướng theo màu của 8 cung lớn (điểm mới)
            updateRoseLabels(window._cungData, sc);

            // Tâm la bàn: điểm HƯỚNG (trên) + điểm GIỜ (dưới)
            const roseCenter = document.getElementById('roseCenter');
            if (roseCenter) {
                roseCenter.innerHTML = scoreText + '<br>' + (hourScore > 0 ? '+' : '') + hourScore;
            }

            // Đồng bộ slider giờ + icon con giáp
            if (window._cungData && window._cungData.info) {
                const gioChi = window._cungData.info.gioChi;
                const gioSlider = document.getElementById('gioSlider');
                if (gioSlider) gioSlider.value = gioChi;
                const gioIcon = document.getElementById('gioIcon');
                if (gioIcon) gioIcon.textContent = GiapEmoji[gioChi];
            }

            // Tổng hợp ngũ hành thịnh/khuyết
            document.getElementById('compassPalace').textContent = hi.summary;
            renderLuanGiai(dir, cell);

            // Cập nhật ô trung tâm (hướng hiện tại + điểm + ngũ hành)
            updateCenterCell(window._cungData);

            // Xoay mặt la bàn: nhãn N luôn chỉ về Bắc thực
            const ring = document.getElementById('roseRing');
            if (ring) {
                ring.style.transform = 'rotate(' + (-h - 180) + 'deg)';
                // Chống xoay chữ: giữ nhãn hướng (N, NE, E...) luôn thẳng đứng
                if (ring.querySelectorAll) {
                    const labels = ring.querySelectorAll('.rose-label');
                    for (let i = 0; i < labels.length; i++) {
                        labels[i].style.transform = 'translate(-50%, -50%) rotate(' + (h + 180) + 'deg)';
                    }
                }
            }
            applyCompassRotation();
        }

        // ---- La bàn thực: cảm biến định hướng (từ kế + con quay hồi chuyển) ----
        function setStatus(live, text) {
            const el = document.getElementById('compassStatus');
            if (!el) return;
            el.textContent = text || '';
            el.className = 'compass-status' + (live ? ' live' : '');
        }

        // Chuẩn hoá + áp heading (0–359) từ cảm biến
        function setHeading(h) {
            if (typeof h !== 'number' || isNaN(h)) return;
            h = ((h % 360) + 360) % 360;
            window._compass.heading = Math.round(h);
            window._compass.rotation = -window._compass.heading - 180;
            window._compass.active = true;
            updateCompass();
        }

        // iOS Safari: webkitCompassHeading (0 = Bắc, tăng theo chiều kim đồng hồ)
        function onDeviceOrientation(e) {
            if (window._compass.manual) return;
            if (typeof e.webkitCompassHeading === 'number') {
                setHeading(e.webkitCompassHeading);
            } else if (e.absolute === true && typeof e.alpha === 'number') {
                setHeading(360 - e.alpha);
            }
        }

        // Android Chrome/Firefox: deviceorientationabsolute (alpha: 0 = Bắc, ngược chiều kim)
        function onDeviceOrientationAbsolute(e) {
            if (window._compass.manual) return;
            if (typeof e.alpha === 'number') {
                setHeading(360 - e.alpha);
            }
        }

        // Android: Generic Sensor API (AbsoluteOrientationSensor) — dự phòng
        function startAbsoluteSensor() {
            if (typeof AbsoluteOrientationSensor === 'undefined') return false;
            try {
                const sensor = new AbsoluteOrientationSensor({ frequency: 30 });
                sensor.addEventListener('reading', function () {
                    if (window._compass.manual) return;
                    const q = sensor.quaternion;
                    if (!q) return;
                    const yaw = Math.atan2(2 * (q[3] * q[2] + q[0] * q[1]), 1 - 2 * (q[1] * q[1] + q[2] * q[2]));
                    setHeading((yaw * 180 / Math.PI + 360) % 360);
                });
                sensor.addEventListener('error', function () {});
                sensor.start();
                window._compass.sensor = sensor;
                return true;
            } catch (err) {
                return false;
            }
        }

        // Bật la bàn (gọi khi người dùng MỞ la bàn)
        function startCompass() {
            if (window._compass.listening) return;
            window._compass.listening = true;
            window.addEventListener('deviceorientation', onDeviceOrientation, true);
            window.addEventListener('deviceorientationabsolute', onDeviceOrientationAbsolute, true);
            startAbsoluteSensor();
        }

        // Tắt la bàn (gọi khi ĐÓNG la bàn)
        function stopCompass() {
            window._compass.listening = false;
            window.removeEventListener('deviceorientation', onDeviceOrientation, true);
            window.removeEventListener('deviceorientationabsolute', onDeviceOrientationAbsolute, true);
            if (window._compass.sensor) {
                try { window._compass.sensor.stop(); } catch (e) {}
                window._compass.sensor = null;
            }
            window._compass.active = false;
            setStatus(false, '');
            updateCompass();
        }

        // ---- Mở / đóng la bàn + xin quyền iOS ----
        const roseEl = document.getElementById('rose');
        const compassLuanGiai = document.getElementById('compassLuanGiai');
        let compassOpen = false;

        function openCompass() {
            compassOpen = true;
            if (compassLuanGiai) compassLuanGiai.classList.remove('hidden');
            if (roseEl) {
                roseEl.classList.add('active');
            }
            // iOS cần xin quyền cảm biến trong một cử chỉ người dùng
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(function (state) {
                    if (state === 'granted') startCompass();
                    else setStatus(false, 'Chưa cấp quyền cảm biến (vào Settings)');
                }).catch(function () { setStatus(false, 'Không cấp được quyền cảm biến'); });
            } else {
                startCompass(); // Android/desktop không cần xin quyền
            }
        }

        function closeCompass() {
            compassOpen = false;
            if (compassLuanGiai) compassLuanGiai.classList.add('hidden');
            if (roseEl) {
                roseEl.classList.remove('active');
            }
            // KHÔNG stopCompass(): giữ cảm biến chạy để 9 vòng tròn vẫn xoay theo khi điện thoại di chuyển
        }

        if (roseEl) {
            roseEl.addEventListener('click', function () {
                if (compassOpen) closeCompass();
                else openCompass();
            });
        }

        // Nút ✕ đóng khung luận giải
        if (compassLuanGiai) {
            compassLuanGiai.addEventListener('click', function (e) {
                if (e.target && e.target.closest && e.target.closest('.lg-close')) closeCompass();
            });
        }


        // Xoay thử (khi mở trên máy tính không có la bàn)
        document.getElementById('headingSlider').addEventListener('input', function () {
            window._compass.manual = true;
            window._compass.heading = parseInt(this.value, 10) || 0;
            window._compass.rotation = -window._compass.heading - 180;
            window._compass.active = true;                  // xoay thủ công
            updateCompass();
        });
        // Slider canh giờ: kéo đổi giờ (thủ công), icon con giáp theo dõi ở cuối
        document.getElementById('gioSlider').addEventListener('input', function () {
            window._compass.manual = true;
            const chiIndex = parseInt(this.value, 10) || 0;
            document.getElementById('gioIcon').textContent = GiapEmoji[chiIndex];
            chonGio(chiIndex);
        });

        // Kéo thả chuột (hoặc chạm) để xoay bàn theo hướng mong muốn
        function initBoardDrag() {
            const board = document.getElementById('board');
            if (!board || !board.addEventListener) return;
            let dragging = false, startAngle = 0, startHeading = 0, tapInfo = null;

            function pointerAngle(clientX, clientY) {
                const rect = board.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                return Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI;
            }
            function onStart(clientX, clientY, e) {
                dragging = true;
                window._compass.manual = true;
                startAngle = pointerAngle(clientX, clientY);
                startHeading = window._compass.heading;
                // Ghi nhận điểm bắt đầu: nếu là vòng tròn trung tâm thì chạm nhẹ = mở luận giải
                const t = (e && e.target && e.target.closest) ? e.target.closest('.center-cell') : null;
                tapInfo = { x: clientX, y: clientY, center: !!t, moved: false };
            }
            function onMove(clientX, clientY) {
                if (!dragging) return;
                if (tapInfo && Math.hypot(clientX - tapInfo.x, clientY - tapInfo.y) > 10) tapInfo.moved = true;
                const a = pointerAngle(clientX, clientY);
                let delta = a - startAngle;
                delta = ((delta + 180) % 360 + 360) % 360 - 180;
                setHeading(startHeading - delta);
            }
            function onEnd() {
                if (!dragging) return;
                dragging = false;
                window._compass.manual = false;
                // Chạm (không kéo) vào vòng tròn trung tâm: mở/đóng luận giải như la bàn nhỏ
                if (tapInfo && tapInfo.center && !tapInfo.moved) {
                    tapInfo = null;
                    if (compassOpen) closeCompass();
                    else {
                        openCompass();
                        if (compassLuanGiai && compassLuanGiai.scrollIntoView) {
                            compassLuanGiai.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    }
                    return;
                }
                tapInfo = null;
                // Tự động chọn lại giờ hiện tại khi thao tác vào các vòng tròn
                const now = new Date();
                const hourInput = document.getElementById('duongHour');
                if (hourInput) hourInput.value = String(now.getHours()).padStart(2, '0');
                capNhatTuDuong();
            }

            board.addEventListener('mousedown', function (e) { onStart(e.clientX, e.clientY, e); if (e.preventDefault) e.preventDefault(); });
            board.addEventListener('touchstart', function (e) { onStart(e.touches[0].clientX, e.touches[0].clientY, e); if (e.preventDefault) e.preventDefault(); }, { passive: false });

            if (document.addEventListener) {
                document.addEventListener('mousemove', function (e) { onMove(e.clientX, e.clientY); });
                document.addEventListener('mouseup', onEnd);
                document.addEventListener('touchmove', function (e) { onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
                document.addEventListener('touchend', onEnd);
            }
        }
        initBoardDrag();

        updateCompass();

        window.onload = function() {
            layGioHienTai();
            updateCompass();
        };
    </script>

</body>
</html>
