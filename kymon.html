<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỳ Môn Độn Giáp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0e1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        .control {
            width: 100%;
            max-width: 920px;
            padding: 8px 0 12px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .control-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px 40px;
            width: 100%;
        }
        .group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }
        .group label {
            font-size: 1.5rem;
            margin-right: 2px;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
        }
        .group label:hover { transform: scale(1.15); color: #f7971e; }
        .group .val-input {
            width: 44px;
            text-align: center;
            font-weight: bold;
            color: #fff;
            font-size: 1.45rem;
            padding: 4px 2px;
            background: #1a2a4a;
            border: 1px solid #2a4a7a;
            border-radius: 8px;
            outline: none;
            transition: 0.2s;
            touch-action: none; /* mobile: cho phép kéo lên/xuống đổi giá trị, không cuộn trang */
        }
        .group .val-input:focus { border-color: #f7971e; background: #1a2a5a; }
        .group .val-input.year-input { width: 60px; }
        .group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #f7971e;
            cursor: pointer;
            margin: 0 4px;
        }
        .group .am-label { font-size: 0.85rem; color: #aaa; font-weight: 500; }

        .gio-compact {
            width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .gio-compact::-webkit-scrollbar { display: none; }
        .gio-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 2px;
        }
        .gio-table td { padding: 0; }

        .top-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }
        .top-table td { vertical-align: middle; text-align: center; padding: 2px 4px; }
        .top-btn-cell { white-space: nowrap; }

        .gio-item-mini {
            padding: 4px 2px;
            border-radius: 8px;
            border: 2px solid #2a4a7a;
            background: #1a1a3e;
            text-align: center;
            vertical-align: middle;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .gio-item-mini:hover { border-color: #f7971e; }
        .gio-item-mini.now { outline: 2px solid #ffffff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.8); z-index: 2; position: relative; }
        .gio-item-mini .line1 { display: block; font-size: 0.72rem; color: #fff; font-weight: 600; }
        .gio-item-mini .line2 { display: block; font-size: 0.6rem; color: #ddd; }

        #board {
            width: 100%;
            max-width: 600px; /* 9 vòng tròn lớn to thêm ~20% (500px → 600px) — grid 3×3 không chồng lấn */
            background: transparent;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            margin: 40px auto auto auto;
            border: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
        }
        .cell {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 3px solid #2a4a7a;
            background: #1a1a40;
            overflow: hidden;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.15), 0 4px 14px rgba(0, 0, 0, 0.5);
        }
        .cell:hover { border-color: #f7971e; z-index: 2; }
        /* Vòng tròn trung tâm (Trung cung): bấm để xem luận giải như la bàn nhỏ */
        .center-cell { cursor: pointer; }
        .center-cell:hover { border-color: #ffffff; box-shadow: 0 0 0 3px rgba(255,255,255,0.22), 0 0 22px rgba(255,255,255,0.45); transform: scale(1.04); }
        .center-cell:active { transform: scale(0.97); }
        .center-cell .center-hint { font-size: 0.55rem; color: rgba(255,255,255,0.85); margin-top: 3px; font-weight: 600; letter-spacing: 0.4px; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
        .cell-inner {
            position: absolute;
            inset: 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: transform 0.4s ease;
        }
        .cell .cung { font-weight: bold; font-size: 0.9rem; color: #fff; }
        .cell .row { line-height: 1.3; font-size: 0.72rem; color: #b0b0b0; }
        .cell .mon { font-weight: bold; color: #7bed9f; }
        .cell .than { font-weight: bold; color: #ffa502; }
        .cell .tinh { color: #70a1ff; }
        .cell .thien { color: #e0a0ff; }
        .cell .dia { color: #a4b0be; }
        .cell .gio { color: #ffd93d; }
        .cell .diem { font-weight: bold; }
        .cell .diem.diem-tot { color: #7bed9f; }
        .cell .diem.diem-xau { color: #ff6b6b; }
        .cell .diem.diem-trung { color: #c8c8d0; }
        .cell-table { width: auto; margin: 0 auto; border-collapse: collapse; }
        .cell-table td { padding: 0 2px; vertical-align: middle; }
        .cell-table .ci { text-align: right; width: 20px; font-size: 0.7rem; white-space: nowrap; }
        .cell-table .ct { text-align: left; font-size: 0.7rem; white-space: nowrap; }
        /* Ô trung tâm (Trung cung): cho chữ xuống dòng, căn giữa */
        .cell.center-cell .cell-table .ct { white-space: normal; text-align: center; line-height: 1.3; }
        /* Trung cung: format cũ 2 cột (cột 1 icon | cột 2 tên + điểm) — chỉ chủ đề ≥ +1 */
        .center-cell .cell-table td { font-size: 0.62rem; padding: 0 3px; vertical-align: middle; }
        .center-cell .ct .cs-s { font-weight: 700; color: #7bed9f; white-space: nowrap; }
        @media (max-width: 450px) {
            .center-cell .cell-table td { font-size: 0.55rem; }
        }
        /* 8 hướng thuần Việt quanh ô trung tâm (như la bàn), luôn thẳng đứng */
        .center-dirs { position: absolute; inset: 0; pointer-events: none; }
        .center-dirs .cdir { position: absolute; transform: translate(-50%, -50%); font-size: 0.5rem; color: #a4b0be; font-weight: bold; }
        .compass-controls .gio-icon { font-size: 1.2rem; min-width: 42px; text-align: right; }

        @media (max-width: 700px) {
            .control-row { gap: 12px 20px; }
            .group .val-input { width: 42px; font-size: 1.3rem; padding: 4px 2px; }
            .group .val-input.year-input { width: 58px; }
            .group label { font-size: 1.4rem; }
            .gio-item-mini { padding: 3px 2px; font-size: 0.6rem; }
            .cell .cung { font-size: 0.8rem; }
            .cell .row { font-size: 0.62rem; }
        }
        @media (max-width: 450px) {
            .control-row { gap: 8px 12px; }
            .group .val-input { width: 34px; font-size: 1.1rem; padding: 2px; }
            .group .val-input.year-input { width: 48px; }
            .group label { font-size: 1.2rem; }
            .gio-item-mini { padding: 2px 1px; font-size: 0.55rem; }
            .cell-inner { inset: 4px; gap: 1px; }
            .cell .cung { font-size: 0.58rem; }
            .cell .row { font-size: 0.46rem; }
        }

        /* ===== La bàn (Compass) ===== */
        .compass-panel {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 5px;
            margin: 0 0 20px;
            width: 100%;
            max-width: 920px;
        }
        .compass-top { width: 100%; }
        .compass-top-table { width: 100%; border-collapse: collapse; }
        .compass-top-table td { vertical-align: middle; padding: 2px 20px; }
        .rose-cell { width: 96px; text-align: center; }
        .info-cell { text-align: left; padding-left: 100px; }
        .rose {
            position: relative;
            width: 96px;
            height: 96px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle, #1a1a40 0%, #0b0e1a 100%);
            border: 3px solid #2a4a7a;
            box-shadow: 0 0 14px rgba(42, 74, 122, 0.6);
            cursor: pointer;
        }
        .rose.active { border-color: #ffffff; box-shadow: 0 0 16px rgba(255, 255, 255, 0.6); }
        .rose-ring { position: absolute; inset: 0; transition: transform 0.25s ease; }
        .rose-label {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 33px;
            height: 33px;
            border-radius: 50%;
            border: 2px solid #2a4a7a;
            background: #1a1a40;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
            color: #ffffff;
        }
        .rose-label .rl-dir { font-weight: bold; font-size: 0.6rem; }
        .rose-label .rl-score { font-size: 0.5rem; }
        .rose-center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            color: #ffffff;
            z-index: 3;
            pointer-events: none;
        }
        .compass-heading { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
        .compass-heading .deg { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .compass-heading .dir { font-size: 1.1rem; font-weight: bold; color: #7bed9f; }
        .compass-heading .diem-heading { font-size: 1.1rem; font-weight: bold; }
        .compass-heading .diem-heading.diem-tot { color: #7bed9f; }
        .compass-heading .diem-heading.diem-xau { color: #ff6b6b; }
        .compass-heading .diem-heading.diem-trung { color: #c8c8d0; }
        .compass-heading .gio-heading { font-size: 1.1rem; font-weight: normal; color: #ffd93d; white-space: nowrap; }
        /* Giờ: desktop hiện tên chi, mobile hiện icon con giáp */
        .gio-ico { display: none; }
        .gio-txt { display: inline; }
        /* Màu dòng 1 la bàn theo trọng số */
        .compass-heading.diem-tot .deg, .compass-heading.diem-tot .dir, .compass-heading.diem-tot .gio-heading { color: #7bed9f; }
        .compass-heading.diem-xau .deg, .compass-heading.diem-xau .dir, .compass-heading.diem-xau .gio-heading { color: #ff6b6b; }
        .compass-heading.diem-trung .deg, .compass-heading.diem-trung .dir, .compass-heading.diem-trung .gio-heading { color: #c8c8d0; }
        .compass-palace {
            margin-top: 2px;
            font-size: 0.95rem;
            color: #ffd93d;
            white-space: nowrap;
        }
        .compass-luan-giai {
            margin: 0;
            text-align: left;
            padding: 20px 0px;
            border-radius: 8px;
            font-size: 1.02rem; /* đã +10% (0.93) rồi +10% nữa theo yêu cầu */
            line-height: 1.5;
            color: #d8d8e0;
        }
        .compass-luan-giai .lg-sec { margin: 4px 0; }
        .compass-luan-giai .lg-tag { font-weight: bold; color: #7dd3fc; }
        .compass-luan-giai .lg-hanh { color: #a4b0be; }
        .compass-luan-giai .lg-verdict { margin: 8px 0; padding: 6px 8px; border-radius: 6px; font-weight: bold; }
        .compass-luan-giai .lg-verdict.tot { background: rgba(46, 204, 113, 0.18); color: #7bed9f; }
        .compass-luan-giai .lg-verdict.xau { background: rgba(231, 76, 60, 0.18); color: #ff6b6b; }
        .compass-luan-giai .lg-verdict.trung { background: rgba(241, 196, 15, 0.15); color: #ffd93d; }
        .compass-luan-giai .lg-block { margin: 6px 0; }
        .compass-luan-giai .lg-h { font-weight: bold; color: #fff; margin-bottom: 2px; }
        .compass-luan-giai ul { margin: 2px 0 4px 18px; padding: 0; }
        .compass-luan-giai li { margin: 1px 0; }
        .compass-luan-giai .lg-do { color: #7bed9f; }
        .compass-luan-giai .lg-dont { color: #ff6b6b; }
        .compass-luan-giai .lg-boost { color: #7dd3fc; }
        .compass-luan-giai .lg-hoa { color: #ffd93d; }
        .compass-luan-giai .lg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 12px; margin-top: 0; }
        .compass-luan-giai .lg-item {
            padding: 4px 6px;
            border-radius: 6px;
        }
        .compass-luan-giai .lg-item.tot { background: rgba(46, 204, 113, 0.30); }
        .compass-luan-giai .lg-item.xau { background: rgba(231, 76, 60, 0.30); }
        .compass-luan-giai .lg-item.trung { background: rgba(241, 196, 15, 0.26); }
        .compass-luan-giai .cd-card {
            padding: 4px 6px;
            border-radius: 6px;
        }
        .compass-luan-giai .cd-card.tot { background: rgba(46, 204, 113, 0.30); }
        .compass-luan-giai .cd-card.xau { background: rgba(231, 76, 60, 0.30); }
        .compass-luan-giai .cd-card.trung { background: rgba(241, 196, 15, 0.26); }
        @media (max-width: 700px) {
            .compass-luan-giai .lg-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .compass-luan-giai .cd-head { margin-bottom: 0; }
        .compass-luan-giai .cd-title { font-weight: bold; color: #fff; font-size: 0.82rem; text-transform: uppercase; }
        .compass-luan-giai .cd-title.tot { color: #7bed9f; }
        .compass-luan-giai .cd-title.xau { color: #ff6b6b; }
        .compass-luan-giai .cd-title.trung { color: #ffd93d; }
        .compass-luan-giai .cd-detail { font-size: 0.76rem; color: #c8c8d0; line-height: 1.45; }
        .compass-luan-giai .cd-detail b { color: #e8e8ee; }
        .compass-luan-giai .cd-item { margin: 0; }
        .compass-luan-giai .cd-sign { margin-right: 3px; font-weight: bold; }
        .compass-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #a4b0be;
        }
        .compass-controls input[type="range"] { flex: 1; min-width: 120px; accent-color: #f7971e; touch-action: none; }
        .compass-controls .heading-val { font-weight: bold; color: #fff; min-width: 42px; text-align: right; }
        .compass-panel.hidden { display: none; }
        .compass-luan-giai.hidden { display: none; }

        /* ===== Luận giải theo hướng — lưới 16 ô chủ đề (4×4) ===== */
        /* Nền mỗi ô = màu tô của HƯỚNG đang chọn (scoreToColor, inline) — chữ trắng đọc được trên nền đậm */
        .compass-luan-giai .lg-grid9 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 4px 0; }
        .compass-luan-giai .lg-cell { border-radius: 8px; padding: 6px 7px; text-align: left; border: 1px solid rgba(255,255,255,0.18); }
        .compass-luan-giai .lg-cell .lg-cell-top { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
        .compass-luan-giai .lg-cell .lg-cell-emoji { font-size: 1.2rem; line-height: 1.2; }
        .compass-luan-giai .lg-cell .lg-cell-name { font-size: 0.85rem; color: #fff; font-weight: 600; flex: 1; }
        .compass-luan-giai .lg-cell .lg-cell-word { font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
        .compass-luan-giai .lg-cell .lg-cell-detail { margin-top: 4px; }
        .compass-luan-giai .lg-cell .lg-reason { font-size: 0.77rem; line-height: 1.4; margin: 2px 0; color: #eef1f5; }
        .compass-luan-giai .lg-cell .lg-reason.fav { color: #d9f7e4; }
        .compass-luan-giai .lg-cell .lg-reason.unfav { color: #ffd6d6; }
        .compass-luan-giai .lg-cell .lg-reason.neu { color: #e2e5ea; }
        .compass-luan-giai .lg-cell.fav .lg-cell-word { color: #c8f7da; }
        .compass-luan-giai .lg-cell.unfav .lg-cell-word { color: #ffd9d9; }
        .compass-luan-giai .lg-cell.mix .lg-cell-word { color: #ffe38f; }
        .compass-luan-giai .lg-cell.neu .lg-cell-word { color: #e8eaf0; }
        @media (max-width: 640px) {
            .compass-luan-giai .lg-grid9 { grid-template-columns: repeat(2, 1fr); }
        }

        .compass-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #1a2a4a, #2a4a7a);
            border: 2px solid #f7971e;
            border-radius: 999px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: 0.2s;
        }
        .compass-toggle:hover { transform: scale(1.05); box-shadow: 0 0 14px rgba(247, 151, 30, 0.5); }
        .compass-toggle.btn-tot { background: rgba(46, 204, 113, 0.30); border-color: #2ecc71; }
        .compass-toggle.btn-xau { background: rgba(231, 76, 60, 0.30); border-color: #e74c3c; }
        .compass-toggle.btn-trung { background: #1a2a4a; border-color: #f1c40f; }
        .compass-toggle.active { box-shadow: 0 0 16px rgba(255, 255, 255, 0.55); }
        /* Trên thiết bị cảm ứng: bỏ hiệu ứng hover (tránh kẹt hover làm lệch màu) */
        @media (hover: none) {
            .compass-toggle:hover { transform: none; box-shadow: none; }
        }
        .compass-status { font-size: 0.85rem; color: #a4b0be; margin-top: 10px; }
        .compass-status.live { color: #7bed9f; }
        .grid { transition: transform 0.4s ease; transform-origin: center center; }

        /* === Mobile layout (≤500px) === */
        @media (max-width: 500px) {
            /* Dòng 1: chuyển 1 hàng 3 cột -> 1 cột 3 dòng */
            .top-table, .top-table tbody, .top-table tr, .top-table td {
                display: block;
                width: 100%;
            }
            .top-table td { padding: 3px 0; }
            /* 12 canh giờ: chỉ icon + giờ bắt đầu */
            .gio-ten, .gio-end { display: none; }
            /* Giờ: mobile hiện icon con giáp thay tên chi */
            .gio-ico { display: inline; }
            .gio-txt { display: none; }
            /* La bàn nhỏ lại, dòng 2 wrap, bar vừa màn hình */
            .rose { width: 100px; height: 100px; }
            .rose-cell { width: 72px; }
            .compass-toggle { width: 100%; justify-content: center; }
            .compass-heading .deg { font-size: 0.9rem; }
            .compass-heading .dir { font-size: 0.9rem; }
            .compass-heading .diem-heading { font-size: 0.9rem; }
            .compass-heading .gio-heading { font-size: 0.9rem; }
            .compass-palace { white-space: normal; font-size: 0.8rem; }
            .compass-controls input[type="range"] { min-width: 0; }
            .cell-table td { padding: 0 1px; }
            .cell-table .ci, .cell-table .ct { font-size: 0.55rem; }
            .cell-inner { gap: 0; }
        }

        /* ==== Responsive chống bể layout (iPhone ~390px, ≤700px) ====
           La bàn nhỏ (.compass-top-table) có min-width ~614px cố định do table
           2 cột (rose + info, padding 100px) → chuyển thành 1 cột dọc. */
        @media (max-width: 700px) {
            body { padding: 10px; }
            .compass-top-table,
            .compass-top-table tbody,
            .compass-top-table tr,
            .compass-top-table td {
                display: block;
                width: 100%;
                box-sizing: border-box;
            }
            .compass-top-table td { padding: 3px 0 !important; text-align: center; }
            .rose-cell { padding: 2px 0 8px !important; }
            .rose { margin: 0 auto; }
            .info-cell { padding-left: 0 !important; }
            .compass-heading {
                justify-content: center;
                flex-wrap: wrap;
                gap: 2px 10px;
                white-space: normal;
            }
            .compass-heading .deg,
            .compass-heading .dir,
            .compass-heading .diem-heading,
            .compass-heading .gio-heading { font-size: 0.85rem; }
            .compass-palace { white-space: normal; text-align: center; font-size: 0.8rem; }
            .compass-controls { width: 100%; justify-content: center; gap: 8px; }
            .compass-controls input[type="range"] { flex: 1 1 auto; min-width: 0; width: 100%; max-width: 280px; }
            .heading-val { flex: 0 0 auto; }
            .control { padding: 4px 0 10px; margin-bottom: 10px; gap: 10px; }
            .compass-luan-giai { padding: 12px 0; }
            .compass-top-table .rose-label { position: absolute; } /* 8 nhãn hướng vẫn bám theo rose */
        }
        /* Rất nhỏ (≤360px): 12 canh giờ & lưới luận giải về 1 cột cho dễ bấm */
        @media (max-width: 360px) {
            .compass-luan-giai .lg-grid9 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Kỳ Môn Độn Giáp – bản chuẩn (rebuild trigger) -->
    <div class="control">
        <table class="top-table">
            <tr>
                <td class="top-cell">
                    <div class="group">
                        <label id="resetSun" title="Click để reset về giờ hiện tại">☀️</label>

    <script src="qimen-interpreter.bundle.js"></script>
    <script>
        // ================================================================
        // 1. THƯ VIỆN ÂM LỊCH HỒ NGỌC ĐỨC (đầy đủ)
        // ================================================================
        const PI = Math.PI;
        function INT(x) { return Math.floor(x); }

        function jdFromDate(dd, mm, yy) {
            var a, y, m, jd;
            a = INT((14 - mm) / 12);
            y = yy + 4800 - a;
            m = mm + 12 * a - 3;
            jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - INT(y / 100) + INT(y / 400) - 32045;
            if (jd < 2299161) {
                jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - 32083;
            }
            return jd;
        }

        function jdToDate(jd) {
            var a, b, c, d, e, m, day, month, year;
            if (jd > 2299160) {
                a = jd + 32044;
                b = INT((4 * a + 3) / 146097);
                c = a - INT((b * 146097) / 4);
            } else {
                b = 0;
                c = jd + 32082;
            }
            d = INT((4 * c + 3) / 1461);
            e = c - INT((1461 * d) / 4);
            m = INT((5 * e + 2) / 153);
            day = e - INT((153 * m + 2) / 5) + 1;
            month = m + 3 - 12 * INT(m / 10);
            year = b * 100 + d - 4800 + INT(m / 10);
            return { day: day, month: month, year: year };
        }

        function getNewMoonDay(k, timeZone) {
            var T, T2, T3, dr, Jd1, M, Mpr, F, C1, deltat, JdNew;
            T = k / 1236.85;
            T2 = T * T;
            T3 = T2 * T;
            dr = PI / 180;
            Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
            Jd1 = Jd1 + 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
            M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
            Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
            F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
            C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M);
            C1 = C1 - 0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(dr * 2 * Mpr);
            C1 = C1 - 0.0004 * Math.sin(dr * 3 * Mpr);
            C1 = C1 + 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mpr));
            C1 = C1 - 0.0074 * Math.sin(dr * (M - Mpr)) + 0.0004 * Math.sin(dr * (2 * F + M));
            C1 = C1 - 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mpr));
            C1 = C1 + 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
            if (T < -11) {
                deltat = 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3;
            } else {
                deltat = -0.000278 + 0.000265 * T + 0.000262 * T2;
            }
            JdNew = Jd1 + C1 - deltat;
            return INT(JdNew + 0.5 + timeZone / 24);
        }

        function getSunLongitude(jdn, timeZone) {
            var T, T2, dr, M, L0, DL, L;
            T = (jdn - 2451545.5 - timeZone / 24) / 36525;
            T2 = T * T;
            dr = PI / 180;
            M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
            L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
            DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M);
            DL = DL + (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
            L = L0 + DL;
            L = L * dr;
            L = L - PI * 2 * (INT(L / (PI * 2)));
            return INT(L / PI * 6);
        }

        function getLunarMonth11(yy, timeZone) {
            var k, off, nm, sunLong;
            off = jdFromDate(31, 12, yy) - 2415021;
            k = INT(off / 29.530588853);
            nm = getNewMoonDay(k, timeZone);
            sunLong = getSunLongitude(nm, timeZone);
            if (sunLong >= 9) {
                nm = getNewMoonDay(k - 1, timeZone);
            }
            return nm;
        }

        function getLeapMonthOffset(a11, timeZone) {
            var k, last, arc, i;
            k = INT((a11 - 2415021.076998695) / 29.530588853 + 0.5);
            last = 0;
            i = 1;
            arc = getSunLongitude(getNewMoonDay(k + i, timeZone), timeZone);
            do {
                last = arc;
                i++;
                arc = getSunLongitude(getNewMoonDay(k + i, timeZone), timeZone);
            } while (arc != last && i < 14);
            return i - 1;
        }

        function convertSolar2Lunar(dd, mm, yy, timeZone) {
            var k, dayNumber, monthStart, a11, b11, lunarDay, lunarMonth, lunarYear, lunarLeap, diff, leapMonthDiff;
            dayNumber = jdFromDate(dd, mm, yy);
            k = INT((dayNumber - 2415021.076998695) / 29.530588853);
            monthStart = getNewMoonDay(k + 1, timeZone);
            if (monthStart > dayNumber) {
                monthStart = getNewMoonDay(k, timeZone);
            }
            a11 = getLunarMonth11(yy, timeZone);
            b11 = a11;
            if (a11 >= monthStart) {
                lunarYear = yy;
                a11 = getLunarMonth11(yy - 1, timeZone);
            } else {
                lunarYear = yy + 1;
                b11 = getLunarMonth11(yy + 1, timeZone);
            }
            lunarDay = dayNumber - monthStart + 1;
            diff = INT((monthStart - a11) / 29);
            lunarLeap = 0;
            lunarMonth = diff + 11;
            if (b11 - a11 > 365) {
                leapMonthDiff = getLeapMonthOffset(a11, timeZone);
                if (diff >= leapMonthDiff) {
                    lunarMonth = diff + 10;
                    if (diff == leapMonthDiff) {
                        lunarLeap = 1;
                    }
                }
            }
            if (lunarMonth > 12) {
                lunarMonth = lunarMonth - 12;
            }
            if (lunarMonth >= 11 && diff < 4) {
                lunarYear -= 1;
            }
            return { day: lunarDay, month: lunarMonth, year: lunarYear, leap: lunarLeap };
        }

        function convertLunar2Solar(lunarDay, lunarMonth, lunarYear, lunarLeap, timeZone) {
            let a11 = getLunarMonth11(lunarYear, timeZone);
            let leapMonth = getLeapMonthOffset(a11, timeZone);
            let months = [];
            for (let i = 11; i <= 12; i++) months.push(i);
            for (let i = 1; i <= 10; i++) months.push(i);
            if (leapMonth > 0 && leapMonth < months.length) {
                months.splice(leapMonth, 0, -1);
            }
            let targetIndex = -1;
            if (lunarLeap === 1) {
                for (let i = 0; i < months.length; i++) {
                    if (months[i] === -1) { targetIndex = i; break; }
                }
            } else {
                for (let i = 0; i < months.length; i++) {
                    if (months[i] === lunarMonth) { targetIndex = i; break; }
                }
            }
            if (targetIndex === -1) return null;
            let jd = a11;
            for (let i = 0; i < targetIndex; i++) {
                let nextNewMoon = getNewMoonDay(Math.floor((jd - 2415021.076998695) / 29.530588853) + 1, timeZone);
                jd = nextNewMoon;
            }
            jd = jd + lunarDay - 1;
            return jdToDate(jd);
        }

        // ================================================================
        // 2. HẰNG SỐ KỲ MÔN
        // ================================================================
        const TEN_CUNG = ['', 'Khảm', 'Khôn', 'Chấn', 'Tốn', 'Trung', 'Càn', 'Đoài', 'Cấn', 'Ly'];
        // Hướng viết tắt của từng cung (để hiển thị "Cấn ĐB", "Chấn Đ"...)
        const CUNG_HUONG = ['', 'B', 'TN', 'Đ', 'ĐN', '', 'TB', 'T', 'ĐB', 'N'];

        const TEN_MON = ['', 'Hưu', 'Sinh', 'Thương', 'Đỗ', 'Cảnh', 'Tử', 'Kinh', 'Khai'];
        // Bát Thần (八神) — hai trường phái:
        //   FIXED (chuẩn 转盘; engine atopx/qimen & qfdk/qimen): Bạch Hổ + Huyền Vũ cho cả Dương/Âm.
        //   YIN_YANG_SWAP: Dương dùng Câu Trần + Chu Tước, Âm dùng Bạch Hổ + Huyền Vũ.
        const TEN_THAN = ['', 'Trực Phù', 'Đằng Xà', 'Thái Âm', 'Lục Hợp', 'Bạch Hổ', 'Huyền Vũ', 'Cửu Địa', 'Cửu Thiên'];
        const TEN_THAN_YANG_SWAP = ['', 'Trực Phù', 'Đằng Xà', 'Thái Âm', 'Lục Hợp', 'Câu Trần', 'Chu Tước', 'Cửu Địa', 'Cửu Thiên'];
        const TEN_TINH = ['', 'Thiên Bồng', 'Thiên Nhuế', 'Thiên Xung', 'Thiên Phụ', 'Thiên Cầm', 'Thiên Tâm', 'Thiên Trụ',
            'Thiên Nhậm', 'Thiên Anh'
        ];
        // Địa bàn cố định (Kỳ Nghi)
        const TEN_KI = ['', 'Mậu', 'Kỷ', 'Canh', 'Tân', 'Nhâm', 'Quý', 'Đinh', 'Bính', 'Át'];

        // Ngũ hành của 9 cung (Hậu Thiên Bát Quái) + màu vòng tương ứng
        const CUNG_HANH = ['', 'Thủy', 'Thổ', 'Mộc', 'Mộc', 'Thổ', 'Kim', 'Kim', 'Thổ', 'Hỏa'];
        const HANH_COLOR = { 'Kim': '#ffffff', 'Mộc': '#2ecc71', 'Thủy': '#000000', 'Hỏa': '#ef4444', 'Thổ': '#f1c40f' };

        // Icon ngũ hành
        const HANH_ICON = {
            'Mộc': '🌳',
            'Kim': '⚔️',
            'Thủy': '🌊',
            'Hỏa': '🔥',
            'Thổ': '⛰️'
        };

        // Thứ tự ngũ hành cố định (tương sinh): Kim -> Thủy -> Mộc -> Hỏa -> Thổ
        const NGU_HANH_ORDER = ['Kim', 'Thủy', 'Mộc', 'Hỏa', 'Thổ'];

        // 12 địa chi (canh giờ)
        const CHI = ['Tý', 'Sửu', 'Dần', 'Mão', 'Thìn', 'Tỵ', 'Ngọ', 'Mùi', 'Thân', 'Dậu', 'Tuất', 'Hợi'];

        // Nội dung ngắn gọn theo môn (được / không được / hóa giải - tăng cường)
        const MON_ADVICE = {
            'Sinh':   { do: 'Khởi công, cầu tài', dont: 'Tránh kiện tụng', hg: '✨ Tăng: xuất hành, khởi sự' },
            'Khai':   { do: 'Mở mang, gặp gỡ', dont: 'Tránh động thổ', hg: '✨ Tăng: mở mang, gặp gỡ' },
            'Hưu':    { do: 'Nghỉ ngơi, tĩnh tâm', dont: 'Tránh đầu tư lớn', hg: '✨ Tăng: nghỉ ngơi, dưỡng sức' },
            'Thương': { do: 'Sửa chữa, thanh tẩy', dont: 'Tránh khởi công', hg: '🧹 Hóa giải: đổi hướng, đổi giờ' },
            'Đỗ':     { do: 'Học tập, lên kế hoạch', dont: 'Tránh ký kết', hg: '🧹 Hóa giải: chọn hướng Sinh/Khai' },
            'Cảnh':   { do: 'Quảng bá, giao tiếp', dont: 'Tránh ẩn mình', hg: '⚠️ Thận trọng giao tiếp' },
            'Tử':     { do: 'Kết thúc, dọn dẹp', dont: 'Tránh việc mới', hg: '🧹 Hóa giải: tránh việc mới' },
            'Kinh':   { do: 'Cảnh giác, bảo vệ', dont: 'Tránh tin người lạ', hg: '🧹 Hóa giải: chọn hướng tốt' }
        };
        const MON_ADVICE_DEFAULT = { do: 'Cân nhắc kỹ', dont: 'Tránh vội vàng', hg: '⚖️ Trung tính' };

        const MON_TOT = ['Sinh', 'Khai', 'Hưu'];
        const MON_XAU = ['Thương', 'Đỗ', 'Cảnh', 'Tử', 'Kinh'];

        const GiapEmoji = ['🐭', '🐮', '🐯', '🐰', '🐲', '🐍', '🐴', '🐐', '🐵', '🐔', '🐶', '🐷'];
        const GiapName = ['Tý', 'Sửu', 'Dần', 'Mão', 'Thìn', 'Tỵ', 'Ngọ', 'Mùi', 'Thân', 'Dậu', 'Tuất', 'Hợi'];
        const GioBatDau = ['23h', '1h', '3h', '5h', '7h', '9h', '11h', '13h', '15h', '17h', '19h', '21h'];

        // ================================================================
        // 3. BẢNG TRA TRỰC PHÙ – TRỰC SỬ (60 GIÁP TÝ)
        // ================================================================
        // Bảng tra Trực Phù (sao) – Trực Sử (cửa) theo 60 Giáp Tý.
        // Sáu tuần (旬), mỗi tuần 10 can chi:
        // Giáp Tý: Trực Phù = Thiên Bồng (1), Trực Sử = Hưu (1)
        // Giáp Tuất: Trực Phù = Thiên Nhuế (2), Trực Sử = Tử (6)
        // Giáp Thân: Trực Phù = Thiên Xung (3), Trực Sử = Thương (3)
        // Giáp Ngọ: Trực Phù = Thiên Phụ (4), Trực Sử = Đỗ (4)
        // Giáp Thìn: Trực Phù = Thiên Cầm (5), Trực Sử = Tử (6, Trung cung)
        // Giáp Dần: Trực Phù = Thiên Tâm (6), Trực Sử = Khai (8)
        const TRUC_MAP = {};
        const TUAN = [
            { tinh: 1, mon: 1 }, // Tuần 0: Giáp Tý
            { tinh: 2, mon: 6 }, // Tuần 1: Giáp Tuất
            { tinh: 3, mon: 3 }, // Tuần 2: Giáp Thân
            { tinh: 4, mon: 4 }, // Tuần 3: Giáp Ngọ
            { tinh: 5, mon: 6 }, // Tuần 4: Giáp Thìn
            { tinh: 6, mon: 8 } // Tuần 5: Giáp Dần
        ];
        for (let tuan = 0; tuan < 6; tuan++) {
            for (let i = 0; i < 10; i++) {
                const idx = tuan * 10 + i;
                TRUC_MAP[idx] = { tinh: TUAN[tuan].tinh, mon: TUAN[tuan].mon };
            }
        }

        // ================================================================
        // THỨ TỰ LẠC THƯ & BẢNG TRA BỔ TRỢ
        // ================================================================
        // Thứ tự Lạc Thư cho 8 cung ngoài (dùng cho sao/cửa/thần di chuyển)
        const LUO_SHU = [1, 8, 3, 4, 9, 2, 7, 6];
        // Thứ tự Lạc Thư đầy đủ 9 cung (gồm Trung cung ở cuối, dùng cho Cửu tinh)
        const LUO_SHU_FULL = [1, 8, 3, 4, 9, 2, 7, 6, 5];
        // Bản cung (home) của Bát Môn -> số thứ tự môn (TEN_MON index).
        // Hưu->Khảm1, Sinh->Cấn8, Thương->Chấn3, Đỗ->Tốn4, Cảnh->Ly9, Tử->Khôn2, Kinh->Đoài7, Khai->Càn6.
        const MON_HOME_INV = { 1: 1, 8: 2, 3: 3, 4: 4, 9: 5, 2: 6, 7: 7, 6: 8 };
        // Thập Can -> Kỳ Nghi (cho quy tắc Trực Phù tùy Thì Can).
        // Giáp (0) ẩn; Ất->9, Bính->8, Đinh->7, Mậu->1, Kỷ->2, Canh->3, Tân->4, Nhâm->5, Quý->6
        const CAN_TO_KY = { 1: 9, 2: 8, 3: 7, 4: 1, 5: 2, 6: 3, 7: 4, 8: 5, 9: 6 };
        // Tuần Thủ (旬首): Lục Nghi ẩn Giáp, Địa chi, Trực Phù, Trực Sử
        const TUAN_INFO = {
            0: { ky: 1, chi: 0, tinh: 1, mon: 1 }, // Giáp Tý: Mậu, Tý
            1: { ky: 2, chi: 10, tinh: 2, mon: 6 }, // Giáp Tuất: Kỷ, Tuất
            2: { ky: 3, chi: 8, tinh: 3, mon: 3 }, // Giáp Thân: Canh, Thân
            3: { ky: 4, chi: 6, tinh: 4, mon: 4 }, // Giáp Ngọ: Tân, Ngọ
            4: { ky: 5, chi: 4, tinh: 5, mon: 6 }, // Giáp Thìn: Nhâm, Thìn
            5: { ky: 6, chi: 2, tinh: 6, mon: 8 } // Giáp Dần: Quý, Dần
        };

        // Hàm lấy số thứ tự của can chi (0-59)
        // Input: ganIdx (0-9), chiIdx (0-11)
        // Output: số thứ tự (0-59)
        function getCanChiIndex(ganIdx, chiIdx) {
            // Dùng CRT: n ≡ ganIdx (mod 10), n ≡ chiIdx (mod 12)
            // Giải hệ: n = ganIdx + 10*k, với k từ 0-5, thỏa mãn n % 12 == chiIdx
            for (let k = 0; k < 6; k++) {
                let n = ganIdx + 10 * k;
                if (n % 12 === chiIdx) return n;
            }
            throw new QimenCalculationError('INVALID_CANZHI', 'Không tìm được số thứ tự 60 Giáp Tý', { ganIdx: ganIdx, chiIdx: chiIdx }, 'getCanChiIndex');
        }

        // ================================================================
        // CẤU HÌNH RULE SET (QIMEN_CONFIG) — khai báo rõ, không âm thầm chọn
        // ================================================================
        // method: 'CHAIBU' (拆补, đang dùng) | 'CHAOSHEN' (超神接气/置闰) | 'MAOSHAN' (茅山)
        //   Lưu ý: 置闰 (zhì rùn) CHƯA được implement — cần chuyên gia chốt nếu dùng CHAOSHEN.
        // dayBoundary: '2300' (truyền thống, 子时 bắt đầu 23:00) | '0000' (hiện đại)
        // yearStart: 'LAP_XUAN' (Lập Xuân) — đã áp dụng trong anBan (dùng solarYear theo Li Chun)
        // spiritRuleset: 'FIXED' (Bạch Hổ/Huyền Vũ cho cả Dương+Âm — chuẩn 转盘) | 'YIN_YANG_SWAP' (Dương: Câu Trần/Chu Tước)
        // tianQinRule: 'JI_KUN2' (Thiên Cầm ký Khôn 2) | 'JI_GEN8_KUN2'
        const QIMEN_CONFIG = {
            method: 'CHAIBU',
            dayBoundary: '2300',
            yearStart: 'LAP_XUAN',
            spiritRuleset: 'FIXED',
            tianQinRule: 'JI_KUN2',
            ruleSetVersion: '1.0.0'
        };

        // Lỗi tính toán rõ ràng — thay mọi silent fallback trong calculation path.
        class QimenCalculationError extends Error {
            constructor(code, message, input, stage) {
                super(message);
                this.name = 'QimenCalculationError';
                this.code = code;
                this.input = input;
                this.stage = stage;
                this.ruleSetVersion = QIMEN_CONFIG.ruleSetVersion;
            }
        }

        // Hash config để ghi vào board (audit + reproducibility).
        function ruleSetHash() {
            const s = JSON.stringify(QIMEN_CONFIG);
            let h = 0;
            for (let i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
            return (h >>> 0).toString(16);
        }

        // Deep freeze — QimenBoard immutable sau khi tạo.
        function deepFreeze(obj) {
            if (obj && typeof obj === 'object' && !Object.isFrozen(obj)) {
                Object.freeze(obj);
                for (const k of Object.keys(obj)) deepFreeze(obj[k]);
            }
            return obj;
        }

        // Nguyên (元) theo Địa chi Phù Đầu — mapping rõ ràng (thay phép chi % 3 khó audit):
        // 子午卯酉 = Thượng nguyên; 辰戌丑未 = Hạ nguyên; 寅申巳亥 = Trung nguyên.
        const YUAN_BY_CHI = {
            0: 'Thượng', 3: 'Thượng', 6: 'Thượng', 9: 'Thượng',
            4: 'Hạ', 10: 'Hạ', 1: 'Hạ', 7: 'Hạ',
            2: 'Trung', 8: 'Trung', 5: 'Trung', 11: 'Trung'
        };

        // ================================================================
        // 4. HÀM XÁC ĐỊNH TIẾT KHÍ & CỤC
        // ================================================================
        const TIET_KHI = [
            { name: 'Lập Xuân', m: 2, d: 4 }, { name: 'Vũ Thủy', m: 2, d: 19 },
            { name: 'Kinh Trập', m: 3, d: 6 }, { name: 'Xuân Phân', m: 3, d: 21 },
            { name: 'Thanh Minh', m: 4, d: 5 }, { name: 'Cốc Vũ', m: 4, d: 20 },
            { name: 'Lập Hạ', m: 5, d: 6 }, { name: 'Tiểu Mãn', m: 5, d: 21 },
            { name: 'Mang Chủng', m: 6, d: 6 }, { name: 'Hạ Chí', m: 6, d: 21 },
            { name: 'Tiểu Thử', m: 7, d: 7 }, { name: 'Đại Thử', m: 7, d: 23 },
            { name: 'Lập Thu', m: 8, d: 8 }, { name: 'Xử Thử', m: 8, d: 23 },
            { name: 'Bạch Lộ', m: 9, d: 8 }, { name: 'Thu Phân', m: 9, d: 23 },
            { name: 'Hàn Lộ', m: 10, d: 8 }, { name: 'Sương Giáng', m: 10, d: 24 },
            { name: 'Lập Đông', m: 11, d: 8 }, { name: 'Tiểu Tuyết', m: 11, d: 22 },
            { name: 'Đại Tuyết', m: 12, d: 7 }, { name: 'Đông Chí', m: 12, d: 22 },
            { name: 'Tiểu Hàn', m: 1, d: 5 }, { name: 'Đại Hàn', m: 1, d: 20 }
        ];

        const CUC_TRA = {
            'Lập Xuân': { 'Thượng': { cuc: 8, duong: true }, 'Trung': { cuc: 5, duong: true }, 'Hạ': { cuc: 2,
                    duong: true } },
            'Vũ Thủy': { 'Thượng': { cuc: 9, duong: true }, 'Trung': { cuc: 6, duong: true }, 'Hạ': { cuc: 3,
                    duong: true } },
            'Kinh Trập': { 'Thượng': { cuc: 1, duong: true }, 'Trung': { cuc: 7, duong: true }, 'Hạ': { cuc: 4,
                    duong: true } },
            'Xuân Phân': { 'Thượng': { cuc: 3, duong: true }, 'Trung': { cuc: 9, duong: true }, 'Hạ': { cuc: 6,
                    duong: true } },
            'Thanh Minh': { 'Thượng': { cuc: 4, duong: true }, 'Trung': { cuc: 1, duong: true }, 'Hạ': { cuc: 7,
                    duong: true } },
            'Cốc Vũ': { 'Thượng': { cuc: 5, duong: true }, 'Trung': { cuc: 2, duong: true }, 'Hạ': { cuc: 8,
                    duong: true } },
            'Lập Hạ': { 'Thượng': { cuc: 4, duong: true }, 'Trung': { cuc: 1, duong: true }, 'Hạ': { cuc: 7,
                    duong: true } },
            'Tiểu Mãn': { 'Thượng': { cuc: 5, duong: true }, 'Trung': { cuc: 2, duong: true }, 'Hạ': { cuc: 8,
                    duong: true } },
            'Mang Chủng': { 'Thượng': { cuc: 6, duong: true }, 'Trung': { cuc: 3, duong: true }, 'Hạ': { cuc: 9,
                    duong: true } },
            'Hạ Chí': { 'Thượng': { cuc: 9, duong: false }, 'Trung': { cuc: 3, duong: false }, 'Hạ': { cuc: 6,
                    duong: false } },
            'Tiểu Thử': { 'Thượng': { cuc: 8, duong: false }, 'Trung': { cuc: 2, duong: false }, 'Hạ': { cuc: 5,
                    duong: false } },
            'Đại Thử': { 'Thượng': { cuc: 7, duong: false }, 'Trung': { cuc: 1, duong: false }, 'Hạ': { cuc: 4,
                    duong: false } },
            'Lập Thu': { 'Thượng': { cuc: 2, duong: false }, 'Trung': { cuc: 5, duong: false }, 'Hạ': { cuc: 8,
                    duong: false } },
            'Xử Thử': { 'Thượng': { cuc: 1, duong: false }, 'Trung': { cuc: 4, duong: false }, 'Hạ': { cuc: 7,
                    duong: false } },
            'Bạch Lộ': { 'Thượng': { cuc: 9, duong: false }, 'Trung': { cuc: 3, duong: false }, 'Hạ': { cuc: 6,
                    duong: false } },
            'Thu Phân': { 'Thượng': { cuc: 7, duong: false }, 'Trung': { cuc: 1, duong: false }, 'Hạ': { cuc: 4,
                    duong: false } },
            'Hàn Lộ': { 'Thượng': { cuc: 6, duong: false }, 'Trung': { cuc: 9, duong: false }, 'Hạ': { cuc: 3,
                    duong: false } },
            'Sương Giáng': { 'Thượng': { cuc: 5, duong: false }, 'Trung': { cuc: 8, duong: false }, 'Hạ': { cuc: 2,
                    duong: false } },
            'Lập Đông': { 'Thượng': { cuc: 6, duong: false }, 'Trung': { cuc: 9, duong: false }, 'Hạ': { cuc: 3,
                    duong: false } },
            'Tiểu Tuyết': { 'Thượng': { cuc: 5, duong: false }, 'Trung': { cuc: 8, duong: false }, 'Hạ': { cuc: 2,
                    duong: false } },
            'Đại Tuyết': { 'Thượng': { cuc: 4, duong: false }, 'Trung': { cuc: 7, duong: false }, 'Hạ': { cuc: 1,
                    duong: false } },
            'Đông Chí': { 'Thượng': { cuc: 1, duong: true }, 'Trung': { cuc: 7, duong: true }, 'Hạ': { cuc: 4,
                    duong: true } },
            'Tiểu Hàn': { 'Thượng': { cuc: 2, duong: true }, 'Trung': { cuc: 8, duong: true }, 'Hạ': { cuc: 5,
                    duong: true } },
            'Đại Hàn': { 'Thượng': { cuc: 3, duong: true }, 'Trung': { cuc: 9, duong: true }, 'Hạ': { cuc: 6,
                    duong: true } }
        };

        // ================================================================
        // TÍNH NGÀY GIAO TIẾT KHÍ CHÍNH XÁC (theo kinh độ hoàng đạo Mặt Trời)
        // ================================================================
        function getSunLongitudeDeg(jdn, timeZone) {
            var T = (jdn - 2451545.5 - timeZone / 24) / 36525;
            var T2 = T * T;
            var dr = PI / 180;
            var M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
            var L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
            var DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M);
            DL = DL + (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
            var L = (L0 + DL) % 360;
            if (L < 0) L += 360;
            return L;
        }

        // Kinh độ hoàng đạo của 24 tiết khí (theo đúng thứ tự mảng TIET_KHI)
        const TIET_KHI_LONG = [315, 330, 345, 0, 15, 30, 45, 60, 75, 90, 105, 120,
            135, 150, 165, 180, 195, 210, 225, 240, 255, 270, 285, 300];

        // Tiết khí EXACT INSTANT (fractional JD) — dùng cho audit + boundary tests.
        function findSolarTermInstant(name, year) {
            const t = TIET_KHI.find(x => x.name === name);
            if (!t) throw new QimenCalculationError('SOLAR_TERM_NOT_FOUND', 'Tiết khí không tồn tại', { name: name }, 'findSolarTermInstant');
            const idx = TIET_KHI.indexOf(t);
            const longitude = TIET_KHI_LONG[idx];
            const approxJd = jdFromDate(t.d, t.m, year);

            let jd1 = approxJd - 3;
            let lng1 = getSunLongitudeDeg(jd1, 7.0);
            for (let i = 0; i < 8; i++) {
                const jd2 = jd1 + 1;
                const lng2 = getSunLongitudeDeg(jd2, 7.0);
                let diff = lng2 - lng1;
                if (diff < -180) diff += 360;
                if (diff > 180) diff -= 360;
                const start = ((longitude - lng1) % 360 + 360) % 360;
                if (diff > 0 && start <= diff) {
                    return jd1 + start / diff; // EXACT INSTANT
                }
                jd1 = jd2;
                lng1 = lng2;
            }
            throw new QimenCalculationError('SOLAR_TERM_NOT_FOUND', 'Không tìm thấy giao điểm tiết khí', { name: name, year: year }, 'findSolarTermInstant');
        }

        // Ngày giao tiết (DAY-LEVEL) — dùng cho Cục 拆补 (khớp convention bazi.vn).
        function findTietKhiJd(name, year) {
            return Math.floor(findSolarTermInstant(name, year) + 0.5);
        }

        // Tiết khí tại một JD bất kỳ (EXACT INSTANT) — term có instant <= target < instant kế tiếp.
        function solarTermAtInstant(targetJd) {
            const approxYear = jdToDate(Math.floor(targetJd)).year;
            let best = null;
            for (let y of [approxYear - 1, approxYear, approxYear + 1]) {
                for (let t of TIET_KHI) {
                    const termJd = findSolarTermInstant(t.name, y);
                    if (termJd <= targetJd) {
                        if (!best || termJd > best.jd) best = { name: t.name, jd: termJd };
                    }
                }
            }
            if (!best) throw new QimenCalculationError('SOLAR_TERM_NOT_FOUND', 'Không xác định được tiết khí tại JD', { targetJd: targetJd }, 'solarTermAtInstant');
            return best;
        }

        // Tiết khí DAY-LEVEL (term có ngày giao tiết <= ngày đang xét) — dùng cho Cục theo Phù Đầu.
        function getTietKhi(month, day, year) {
            const targetJd = jdFromDate(day, month, year);
            let best = null;
            for (let y of [year - 1, year, year + 1]) {
                for (let t of TIET_KHI) {
                    const termJd = findTietKhiJd(t.name, y); // day-level
                    if (termJd <= targetJd) {
                        if (!best || termJd > best.jd) best = { name: t.name, jd: termJd };
                    }
                }
            }
            if (!best) throw new QimenCalculationError('SOLAR_TERM_NOT_FOUND', 'Không xác định được tiết khí hiện tại', { month: month, day: day, year: year }, 'getTietKhi');
            return best;
        }

        function tinhCuc(month, day, year) {
            const jd = jdFromDate(day, month, year);

            // Xác định Nguyên (Thượng/Trung/Hạ) theo chu kỳ 60 Giáp Tý (cố định):
            // Phù Đầu là ngày Giáp/Kỷ, chỉ số luôn là bội của 5 trong 60 Giáp Tý.
            // Địa chi của Phù Đầu quyết định Nguyên:
            //   Tý/Ngọ/Mão/Dậu (Tứ Trọng, chi % 3 == 0) -> Thượng nguyên
            //   Thìn/Tuất/Sửu/Mùi (Tứ Mộ, chi % 3 == 1) -> Hạ nguyên
            //   Dần/Thân/Tỵ/Hợi (Tứ Sinh, chi % 3 == 2) -> Trung nguyên
            const dayInfo = getDayCanChi(jd);
            const n = getCanChiIndex(dayInfo.ganIdx, dayInfo.chiIdx);
            const fu = n - (n % 5);   // chỉ số Phù Đầu (bội của 5)
            const chi = fu % 12;      // Địa chi của Phù Đầu
            const nguyen = YUAN_BY_CHI[chi];
            if (!nguyen) throw new QimenCalculationError('INVALID_YUAN', 'Địa chi Phù Đầu không hợp lệ', { chi: chi }, 'tinhCuc');

            // Tiết khí xét theo ngày Phù Đầu (超神接气): lấy tiết khí kế tiếp tính từ Phù Đầu.
            const fuDate = jdToDate(jd - (n % 5));
            const tiet = getTietKhi(fuDate.month, fuDate.day, fuDate.year);

            const info = CUC_TRA[tiet.name];
            if (info && info[nguyen]) {
                return {
                    so: info[nguyen].cuc,
                    duong: info[nguyen].duong,
                    tiet: tiet.name,
                    nguyen: nguyen
                };
            }
            throw new QimenCalculationError('JU_NOT_FOUND', 'Không tìm thấy cục cho tiết khí/nguyên', { tiet: tiet.name, nguyen: nguyen }, 'tinhCuc');
        }

        // ================================================================
        // ZHIRUN (置闰) — engine ĐỘC LẬP, port từ atopx/qimen internal/compute/zhirun.go (MIT).
        // Source: https://github.com/atopx/qimen/blob/master/internal/compute/zhirun.go
        // Status: IMPLEMENTATION_VERIFIED (port) · SOURCE_SUPPORTED (atopx) — CHƯA có citation cổ thư.
        // ================================================================
        const ZHI_RUN_THRESHOLD = 7; // "符头超前九日则置闰" (tính gồm ngày 符头) = interval 8 → ngưỡng 7

        function mod15(x) { return ((x % 15) + 15) % 15; }
        function dayNumber(jd) { return Math.floor(jd + 0.5); }
        // 符头 (15-day leader: 甲子/己卯/甲午/己酉) tại hoặc trước ngày jd.
        function leaderDay(jd) { const dn = dayNumber(jd); return dn - mod15(dn + 49); }
        // 符头 "nhận" điểm chí (adopting leader): lead 0..7 → 超神/正授; lead 8..14 → 置闰 → 接气.
        function adoptingLeader(solsticeJd) {
            const zd = dayNumber(solsticeJd);
            const lead = mod15(zd + 49);
            const g = zd - lead;
            return (lead > ZHI_RUN_THRESHOLD) ? g + 15 : g;
        }
        function termIndexOf(name) {
            for (let i = 0; i < TIET_KHI.length; i++) if (TIET_KHI[i].name === name) return i;
            throw new QimenCalculationError('SOLAR_TERM_NOT_FOUND', 'Tiết khí không tồn tại', { name: name }, 'termIndexOf');
        }

        // Working term (用局节气) theo 置闰: từ điểm chí "nhận" (đông chí/hạ chí),
        // mỗi 符头 tiến 1 tiết; 芒种/大雪 có thể lặp (30 ngày) khi 置闰.
        function nearestSolstice(name, jd, direction) {
            const approxYear = jdToDate(Math.floor(jd)).year;
            let best = null;
            for (let y = approxYear - 1; y <= approxYear + 1; y++) {
                const sJd = findTietKhiJd(name, y);
                if (direction < 0 && sJd <= jd) { if (!best || sJd > best.jd) best = { name: name, jd: sJd }; }
                if (direction > 0 && sJd > jd) { if (!best || sJd < best.jd) best = { name: name, jd: sJd }; }
            }
            if (!best) throw new QimenCalculationError('SOLAR_TERM_NOT_FOUND', 'Không tìm thấy điểm chí', { name: name, jd: jd }, 'nearestSolstice');
            return best;
        }

        function zhiRunWorkingTermName(jd, realTermName) {
            const f = leaderDay(jd);
            const dongChiCur = nearestSolstice('Đông Chí', jd, -1);
            const haChiCur = nearestSolstice('Hạ Chí', jd, -1);
            let candidates;
            if (dongChiCur.jd > haChiCur.jd) {
                // Dương nửa năm (điểm chí gần nhất là Đông Chí)
                candidates = [
                    nearestSolstice('Hạ Chí', jd, +1),          // Hạ Chí sắp tới
                    dongChiCur,                                 // Đông Chí hiện tại
                    nearestSolstice('Hạ Chí', dongChiCur.jd, -1) // Hạ Chí trước đó
                ];
            } else {
                // Âm nửa năm (điểm chí gần nhất là Hạ Chí)
                candidates = [
                    nearestSolstice('Đông Chí', jd, +1),         // Đông Chí sắp tới
                    haChiCur,                                     // Hạ Chí hiện tại
                    nearestSolstice('Đông Chí', haChiCur.jd, -1)  // Đông Chí trước đó
                ];
            }
            for (const z of candidates) {
                const g = adoptingLeader(z.jd);
                if (g > f) continue;
                let k = (f - g) / 15;
                if (k > 11) k = 11;
                const zIdx = termIndexOf(z.name);
                return TIET_KHI[(zIdx + k) % 24].name;
            }
            return realTermName;
        }

        function resolveJuZhiRun(month, day, year) {
            const jd = jdFromDate(day, month, year);
            const dayN = ((jd + 49) % 60 + 60) % 60;
            const fu = dayN - (dayN % 5);
            const chi = fu % 12;
            const nguyen = YUAN_BY_CHI[chi];
            if (!nguyen) throw new QimenCalculationError('INVALID_YUAN', 'Địa chi Phù Đầu không hợp lệ', { chi: chi }, 'resolveJuZhiRun');
            const realTerm = getTietKhi(month, day, year).name;
            const workingTerm = zhiRunWorkingTermName(jd, realTerm);
            const info = CUC_TRA[workingTerm];
            if (!info || !info[nguyen]) throw new QimenCalculationError('JU_NOT_FOUND', 'Không tìm thấy cục (ZHIRUN)', { tiet: workingTerm, nguyen: nguyen }, 'resolveJuZhiRun');
            return { so: info[nguyen].cuc, duong: info[nguyen].duong, tiet: workingTerm, nguyen: nguyen };
        }

        function resolveJu(month, day, year, juRule) {
            return (juRule === 'ZHIRUN') ? resolveJuZhiRun(month, day, year) : tinhCuc(month, day, year);
        }

        // ================================================================
        // 5. HÀM AN BÀN KỲ MÔN (CHUẨN)
        // ================================================================
        function getCanChi(year) {
            const gan = ['Giáp', 'Ất', 'Bính', 'Đinh', 'Mậu', 'Kỷ', 'Canh', 'Tân', 'Nhâm', 'Quý'];
            const chi = ['Tý', 'Sửu', 'Dần', 'Mão', 'Thìn', 'Tỵ', 'Ngọ', 'Mùi', 'Thân', 'Dậu', 'Tuất', 'Hợi'];
            let ganIdx = (year - 4) % 10;
            let chiIdx = (year - 4) % 12;
            if (ganIdx < 0) ganIdx += 10;
            if (chiIdx < 0) chiIdx += 12;
            return { gan: gan[ganIdx], chi: chi[chiIdx], ganIdx: ganIdx, chiIdx: chiIdx };
        }

        function getDayCanChi(jd) {
            const gan = ['Giáp', 'Ất', 'Bính', 'Đinh', 'Mậu', 'Kỷ', 'Canh', 'Tân', 'Nhâm', 'Quý'];
            const chi = ['Tý', 'Sửu', 'Dần', 'Mão', 'Thìn', 'Tỵ', 'Ngọ', 'Mùi', 'Thân', 'Dậu', 'Tuất', 'Hợi'];
            // Can chi ngày chuẩn: số thứ tự 60 Giáp Tý = (jd + 49) % 60 (Giáp Tý = 0)
            // Kiểm chứng: 01/10/1949 (jd=2433191) -> Giáp Tý; 10/02/2024 (jd=2460351) -> Giáp Thìn
            const idx = ((jd + 49) % 60 + 60) % 60;
            const ganIdx = idx % 10;
            const chiIdx = idx % 12;
            return { gan: gan[ganIdx], chi: chi[chiIdx], ganIdx: ganIdx, chiIdx: chiIdx };
        }

        function anBan(date, opts) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const hours = date.getHours();
            const jd = jdFromDate(day, month, year);
            const lunar = convertSolar2Lunar(day, month, year, 7.0);
            // Năm Can Chi theo Lập Xuân (Li Chun): trước Lập Xuân → dùng năm trước.
            const liChunJd = findTietKhiJd('Lập Xuân', year);
            const solarYear = (jd < liChunJd) ? year - 1 : year;
            const yearCanChi = getCanChi(solarYear);

            // DAY_BOUNDARY: '2300' (default, 子时 bắt đầu 23:00) | '0000' (đổi ngày lúc 0:00).
            const dayBoundary = (opts && opts.dayBoundaryMode) || QIMEN_CONFIG.dayBoundary;
            let ganzhiJd = jd;
            if (dayBoundary === '2300' && hours >= 23) {
                ganzhiJd = jd + 1; // 23:00–23:59 thuộc ngày kế tiếp (子时)
            }
            const dayInfo = getDayCanChi(ganzhiJd);

            // 1. Can chi giờ
            const gioChi = Math.floor((hours + 1) / 2) % 12; // 0=Tý, 1=Sửu, ...
            const gioGan = (dayInfo.ganIdx * 2 + gioChi) % 10;

            // 2. Xác định cục (juRule: 'CHAIBU' default | 'ZHIRUN')
            const juRule = (opts && opts.juRule) || 'CHAIBU';
            const cuc = resolveJu(month, day, year, juRule);

            // 3. Sắp Địa bàn (Kỳ Nghi) theo cục số.
            // Thứ tự Kỳ Nghi: Mậu(1) Kỷ(2) Canh(3) Tân(4) Nhâm(5) Quý(6) Đinh(7) Bính(8) Ất(9).
            // Dương độn đi thuận (tăng cung), Âm độn đi nghịch (giảm cung).
            const diaBan = {};    // cung -> kỳ nghi index (1..9)
            const kyTaiCung = {}; // kỳ nghi index -> cung
            let kyIdx = 1;
            let cungIdx = cuc.so;
            for (let i = 0; i < 9; i++) {
                diaBan[cungIdx] = kyIdx;
                kyTaiCung[kyIdx] = cungIdx;
                if (cuc.duong) {
                    cungIdx = (cungIdx % 9) + 1;
                } else {
                    cungIdx = ((cungIdx - 2 + 9) % 9) + 1;
                }
                kyIdx++;
            }

            // 4. Tìm Trực Phù (sao) và Trực Sử (cửa) theo Tuần (旬) của GIỜ (时旬首).
            // Trực Phù = Cửu Tinh có bản cung chứa Lục Nghi của Tuần Thủ (trên Địa bàn);
            // Trực Sử = Bát Môn có bản cung đó. Trung cung (5) ký gửi Khôn (2).
            const chiIndex = getCanChiIndex(gioGan, gioChi);
            const tuanIdx = Math.floor(chiIndex / 10);
            const tuan = TUAN_INFO[tuanIdx];
            if (!tuan) throw new QimenCalculationError('INVALID_XUN_INDEX', 'Chỉ số tuần (旬) không hợp lệ', { chiIndex: chiIndex, tuanIdx: tuanIdx }, 'anBan.xunshou');
            const giapKyCung = kyTaiCung[tuan.ky];      // cung chứa Lục Nghi của Tuần Thủ
            const chiefHome = (giapKyCung === 5) ? 2 : giapKyCung; // Trung cung ký Khôn
            const trucPhuTinh = chiefHome;              // sao có bản cung = cung chứa Tuần Thủ
            const trucSuMon = MON_HOME_INV[chiefHome];  // cửa có bản cung = cung đó

            // 5. Trực Phù tùy Thì Can (值符随时干)
            let trucPhuCung;
            if (gioGan === 0) {
                // Giờ Giáp: Trực Phù về bản cung của Tuần Thủ
                trucPhuCung = giapKyCung;
            } else {
                trucPhuCung = kyTaiCung[CAN_TO_KY[gioGan]];
            }

            // 6. Xoay Thiên bàn (三奇六仪) — vòng LẠC THƯ xoay cứng, Trung cung giữ nguyên.
            // Lục Nghi Tuần Thủ di chuyển từ 值符原宫 tới 时干落宫. (Vòng xoay không phân thuận/nghịch:
            // Dương/Âm chỉ quyết định nơi Trực Phù đáp, không đổi chiều vòng Lạc Thư.)
            // SOURCE: atopx/qimen plate.RotateStems (đã đối chiếu độc lập với engine Go).
            const chiefCung = (giapKyCung === 5) ? 2 : giapKyCung;    // 值符原宫 (Trung→Khôn)
            const thiCanCung = (trucPhuCung === 5) ? 2 : trucPhuCung;  // 时干落宫 (Trung→Khôn)
            const chiefRing = LUO_SHU.indexOf(chiefCung);
            const thiCanRing = LUO_SHU.indexOf(thiCanCung);
            const ringSteps = (thiCanRing - chiefRing + 8) % 8;
            const heavenPlateRule = (opts && opts.heavenPlateRule) || 'LUOSHU';
            const thienBan = {};
            if (heavenPlateRule === 'LINEAR') {
                // Biến thể SO SÁNH (KHÔNG phải default): xoay tuyến tính 1..9.
                const rotLinear = (c, k) => ((c - 1 + k) % 9 + 9) % 9 + 1;
                const steps = cuc.duong
                    ? ((thiCanCung - chiefCung + 9) % 9)
                    : ((chiefCung - thiCanCung + 9) % 9);
                for (let p = 1; p <= 9; p++) {
                    thienBan[p] = diaBan[cuc.duong ? rotLinear(p, -steps) : rotLinear(p, steps)];
                }
            } else {
                thienBan[5] = diaBan[5]; // Trung cung giữ nguyên Kỳ Nghi (không xoay)
                for (let i = 0; i < 8; i++) {
                    const srcPalace = LUO_SHU[i];
                    const dstPalace = LUO_SHU[(i + ringSteps) % 8];
                    thienBan[dstPalace] = diaBan[srcPalace];
                }
            }

            // 7. An Cửu tinh (转盘: 8 sao ngoài xoay theo vòng Lạc Thư, Thiên Cầm giữ Trung cung)
            const starAtPalace = {};
            const starRing = [1, 8, 3, 4, 9, 2, 7, 6]; // Bồng Nhậm Xung Phụ Anh Nhuế Trụ Tâm (theo vòng Lạc Thư)
            let anchor = (trucPhuCung === 5) ? 2 : trucPhuCung; // Trung cung ký Khôn
            let ringPos = LUO_SHU.indexOf(anchor);
            if (ringPos === -1) throw new QimenCalculationError('INVALID_PALACE', 'Cung không thuộc vòng Lạc Thư', { anchor: anchor }, 'anBan.stars');
            let starIdx = starRing.indexOf(trucPhuTinh);
            if (starIdx === -1) throw new QimenCalculationError('INVALID_STAR', 'Sao không thuộc vòng Lạc Thư', { trucPhuTinh: trucPhuTinh }, 'anBan.stars');
            for (let i = 0; i < 8; i++) {
                const palace = LUO_SHU[ringPos];
                starAtPalace[palace] = starRing[starIdx];
                ringPos = (ringPos + (cuc.duong ? 1 : -1) + 8) % 8;
                starIdx = (starIdx + (cuc.duong ? 1 : -1) + 8) % 8;
            }
            // 天禽 (Thiên Cầm): JI_KUN2 (default, 禽芮 — Trung không sao) | KEEP_CENTER (giữ Trung).
            const tianQinRule = (opts && opts.tianQinRule) || QIMEN_CONFIG.tianQinRule;
            if (tianQinRule === 'KEEP_CENTER') {
                starAtPalace[5] = 5;
            }

            // 8. An Bát môn — 值使随时支: 值使 từ 值符原宫 đi theo số bước (时支 − 旬首支),
            //    thuận (Dương) / nghịch (Âm) qua vòng 1..9; rồi 8 môn xoay cứng theo vòng Lạc Thư.
            // SOURCE: atopx/qimen plate.BuildDoor + MoveBy (đã đối chiếu độc lập).
            const marchFrom = giapKyCung;                    // 值符原宫 (có thể là Trung cung 5)
            const marchSteps = (gioChi - tuan.chi + 12) % 12; // số bước từ 旬首支 tới 时支
            const moveBy = (palace, steps, duong) => {
                const idx = duong
                    ? ((palace - 1 + steps) % 9)
                    : (((palace - 1 - steps) % 9) + 9) % 9;
                return idx + 1;
            };
            const trucSuCung = moveBy(marchFrom, marchSteps, cuc.duong); // 值使落宫 (có thể là 5)
            const landEff = (trucSuCung === 5) ? 2 : trucSuCung;
            const zhiShiHome = chiefHome; // bản cung 值使 (đã ký Khôn nếu Trung)
            const doorShift = (LUO_SHU.indexOf(landEff) - LUO_SHU.indexOf(zhiShiHome) + 8) % 8;
            const doorAtPalace = {};
            for (let i = 0; i < 8; i++) {
                const home = LUO_SHU[i];
                const dst = LUO_SHU[(i + doorShift) % 8];
                doorAtPalace[dst] = MON_HOME_INV[home];
            }

            // 9. An Bát thần
            const spiritAtPalace = {};
            let spiritStart = trucPhuCung;
            if (spiritStart === 5) spiritStart = 2; // Trực Phù ở Trung cung thì thần ký Khôn
            let spiritPos = LUO_SHU.indexOf(spiritStart);
            for (let i = 0; i < 8; i++) {
                const palace = LUO_SHU[spiritPos];
                spiritAtPalace[palace] = i + 1;
                spiritPos = (spiritPos + (cuc.duong ? 1 : -1) + 8) % 8;
            }

            // 10. Đổ vào bàn
            const cung = [];
            for (let i = 0; i <= 9; i++) {
                cung[i] = { ten: TEN_CUNG[i], mon: '', than: '', tinh: '', dia: '', thien: '' };
            }
            const spiritRuleset = (opts && opts.spiritRuleset) || QIMEN_CONFIG.spiritRuleset;
            const thanArr = (spiritRuleset === 'YIN_YANG_SWAP' && cuc.duong)
                ? TEN_THAN_YANG_SWAP : TEN_THAN;
            for (let p = 1; p <= 9; p++) {
                cung[p].mon = TEN_MON[doorAtPalace[p]] || '';
                cung[p].than = thanArr[spiritAtPalace[p]] || '';
                cung[p].tinh = TEN_TINH[starAtPalace[p]] || '';
                cung[p].dia = TEN_KI[diaBan[p]] || '';
                cung[p].thien = TEN_KI[thienBan[p]] || '';
            }

            // Lưu thông tin
            cung['info'] = {
                lunar: lunar,
                yearCanChi: yearCanChi,
                dayCanChi: dayInfo.gan + ' ' + dayInfo.chi,
                dayGanIdx: dayInfo.ganIdx,
                cuc: cuc,
                gioGan: gioGan,
                gioChi: gioChi,
                trucPhu: { cung: trucPhuCung, tinh: trucPhuTinh },
                trucSu: { mon: trucSuMon, cung: trucSuCung },
                date: date,
                ruleSetVersion: QIMEN_CONFIG.ruleSetVersion,
                ruleSetHash: ruleSetHash(),
                method: 'ShiJia',
                style: 'ZhuanPan',
                juRule: juRule,
                dayBoundary: dayBoundary,
                timezoneMode: 'IANA_CIVIL' // chưa implement IANA; giữ nhãn để audit
            };

            // QimenBoard immutable — không được sửa sau khi lập.
            return deepFreeze(cung);
        }

        function getMauSac(mon) {
            // Càng tốt càng xanh, càng xấu càng đỏ (theo thứ tự lành dữ của Bát Môn):
            // Tốt: Sinh (nhất) -> Khai -> Hưu ; Xấu tăng dần: Cảnh -> Đỗ -> Thương -> Kinh -> Tử (nặng nhất)
            const doTot = {

            };

        function hienThiBan(cung) {
            const board = document.getElementById('board');
            // Bố cục 3x3: Nam ở trên, Bắc ở dưới (truyền thống Kỳ Môn)
            const gridOrder = [4, 9, 2, 3, 5, 7, 8, 1, 6];
            let html = '<div class="grid">';
            for (let i = 0; i < 9; i++) {
                const idx = gridOrder[i];
                const cell = cung[idx];
                if (idx === 5) {
                    // Ô trung tâm: hướng hiện tại + điểm + ngũ hành thịnh/khuyết (màu theo trọng số)
                    const hi = headingInfo(cung);
                    const st = scoreStyle(hi.scoreCls);
                    html += `<div class="cell center-cell" style="background:${st.bg}; border-color:${st.bd};">
                                <div class="cell-inner" style="color:${st.txt}">
                                    <table class="cell-table">
                                        ${iqCenterTopicsHTML(cung)}
                                    </table>
                                </div>
                            </div>`;
                    continue;
                }
                const iqsc = iqScores();
                const score10 = (iqsc && iqsc.per[idx] !== undefined) ? iqsc.per[idx] : normalizeScore(palaceScore(cell));
                const bg = scoreToColor(score10);
                const scoreText = (score10 > 0 ? '+' : '') + score10;
                const scoreCls = score10 > 0 ? 'diem-tot' : (score10 < 0 ? 'diem-xau' : 'diem-trung');
                const hanh = CUNG_HANH[idx];
                const ring = HANH_COLOR[hanh];
                const iconCung = HANH_ICON[hanh] || '';
                const iconMon = (cell.mon && MON_LUAN[cell.mon]) ? (HANH_ICON[MON_LUAN[cell.mon].hanh] || '') : '';
                const iconTinh = (cell.tinh && TINH_LUAN[cell.tinh]) ? (HANH_ICON[TINH_LUAN[cell.tinh].hanh] || '') : '';
                const iconThan = HANH_ICON[THAN_HANH[cell.than]] || '';
                html += `<div class="cell" style="background:${bg}; border-color:${ring};">
                            <div class="cell-inner">
                                <table class="cell-table">
                                    <tr><td class="ci">${iconCung}</td><td class="ct">${cell.ten || '—'}${CUNG_HUONG[idx] ? ' ' + CUNG_HUONG[idx] : ''} <span class="diem ${scoreCls}">${scoreText}</span></td></tr>
                                    <tr><td class="ci">${iconMon}</td><td class="ct">${cell.mon || '—'}</td></tr>
                                    <tr><td class="ci">${iconTinh}</td><td class="ct">${cell.tinh || '—'}</td></tr>
                                    <tr><td class="ci">${iconThan}</td><td class="ct">${cell.than || '—'}</td></tr>
                                </table>
                            </div>
                        </div>`;
            }
            html += '</div>';
            board.innerHTML = html;
            updateCompass();
        }

        // ================================================================
        // 6. GIỜ HOÀNG ĐẠO / HẮC ĐẠO (thu nhỏ, chỉ giờ bắt đầu)
        // ================================================================
        // 12 sao Hoàng Đạo / Hắc Đạo (thứ tự cố định, luân phiên theo chi can giờ).
        // good=true: Hoàng Đạo (cát); false: Hắc Đạo (hung).
        // level để tô gradient: càng tốt càng xanh, càng xấu càng đỏ.
        const HOANG_HAC_STARS = [
            { name: 'Thanh Long', good: true,  level: 0 },  // cát nhất
            { name: 'Minh Đường', good: true,  level: 1 },
            { name: 'Thiên Hình', good: false, level: 7 },
            { name: 'Chu Tước',   good: false, level: 6 },
            { name: 'Kim Quỹ',    good: true,  level: 2 },
            { name: 'Thiên Đức',  good: true,  level: 3 },
            { name: 'Bạch Hổ',    good: false, level: 10 },
            { name: 'Ngọc Đường', good: true,  level: 4 },
            { name: 'Thiên Lao',  good: false, level: 8 },
            { name: 'Huyền Vũ',   good: false, level: 9 },
            { name: 'Tư Mệnh',    good: true,  level: 5 },
            { name: 'Câu Trần',   good: false, level: 11 } // hung nhất
        ];

        // Giờ khởi đầu của Thanh Long theo Can ngày (quy tắc "Thanh Long khởi thời"):
        // Giáp/Kỷ -> Tý(0), Ất/Canh -> Dần(2), Bính/Tân -> Thìn(4), Đinh/Nhâm -> Ngọ(6), Mậu/Quý -> Thân(8)
        const THANH_LONG_START = { 0: 0, 5: 0, 1: 2, 6: 2, 2: 4, 7: 4, 3: 6, 8: 6, 4: 8, 9: 8 };

        function getGioStarInfo(dayGanIdx, chiIdx) {
            const start = (THANH_LONG_START[dayGanIdx] !== undefined) ? THANH_LONG_START[dayGanIdx] : 0;
            const pos = ((chiIdx - start) % 12 + 12) % 12;
            return HOANG_HAC_STARS[pos];
        }

        function getGioBackgroundColor(level) {
            const colors = [
                '#00a040', '#1aa848', '#34b050', '#4eb858', '#68c060', '#82c868', // 0-5 xanh (tốt, đậm -> nhạt)
                '#d8786a', '#c85a5c', '#b83c4e', '#a81e40', '#980832', '#880024' // 6-11 đỏ (xấu, nhạt -> đậm)
            ];
            return colors[Math.min(Math.max(level, 0), colors.length - 1)] || '#2a4a7a';
        }

        function renderGioCompact(dayGanIdx) {
            const chi = ['Tý', 'Sửu', 'Dần', 'Mão', 'Thìn', 'Tỵ', 'Ngọ', 'Mùi', 'Thân', 'Dậu', 'Tuất', 'Hợi'];
            const selectedHour = parseInt(document.getElementById('duongHour').value) || 0;
            const currentChi = Math.floor((selectedHour + 1) / 2) % 12;

            let container = document.getElementById('gioCompact');
            // Điểm 12 canh giờ (Rule Engine −9..+9): tổng điểm tốt − tổng điểm xấu của TẤT CẢ hướng trong giờ đó
            const hourScores = iqHourScores();
            let html = '<table class="gio-table"><tr>';
            for (let i = 0; i < 12; i++) {
                const sc = (hourScores && hourScores[i] !== undefined) ? hourScores[i] : 0;
                const bg = scoreToColor(sc);
                const border = sc > 0 ? '#2ecc71' : (sc < 0 ? '#e74c3c' : '#2a4a7a');
                const emoji = GiapEmoji[i];
                const tenChi = chi[i];
                const gioBD = GioBatDau[i];
                const gioEnd = GioBatDau[(i + 1) % 12];
                const isNow = (i === currentChi);
                const scText = (sc > 0 ? '+' : '') + sc;
                html += `<td class="gio-item-mini${isNow ? ' now' : ''}" style="background:${bg}; border-color:${border};" onclick="chonGio(${i})" title="${tenChi} ${scText}${isNow ? ' - GIỜ HIỆN TẠI' : ''}">

                            <span class="line2"><span class="gio-bd">${gioBD}</span><span class="gio-end"> - ${gioEnd}</span></span>
                        </td>`;
            }
            html += '</tr></table>';
            container.innerHTML = html;
        }

        // Điểm của 12 canh giờ trong NGÀY hiện tại (cache theo ngày):
        // mỗi giờ dựng lá số riêng (anBan) → scoreHour = tổng điểm tốt − tổng điểm xấu mọi hướng
        function iqHourScores() {
            if (!window.KYMON_IQ) return null;
            const y = parseInt(document.getElementById('duongYear').value) || 2024;
            const m = parseInt(document.getElementById('duongMonth').value) || 1;
            const d = parseInt(document.getElementById('duongDay').value) || 1;
            const key = y + '-' + m + '-' + d;
            if (window._iqHourCache && window._iqHourCache.key === key) return window._iqHourCache.scores;
            const scores = {};
            for (let i = 0; i < 12; i++) {
                let startHour = (i * 2 - 1) % 24;
                if (startHour < 0) startHour = 23;
                try {
                    const chart = anBan(new Date(y, m - 1, d, startHour, 0, 0));
                    scores[i] = window.KYMON_IQ.scoreHour(chart).score;
                } catch (e) { scores[i] = 0; }
            }
            window._iqHourCache = { key: key, scores: scores };
            return scores;
        }

        document.querySelectorAll('.val-input').forEach(input => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                const field = this.dataset.field;
                let val = parseInt(this.value) || 0;
                if (field === 'year') val = Math.max(1900, Math.min(2100, val));
                else if (field === 'month') val = Math.max(1, Math.min(12, val));
                else if (field === 'day') val = Math.max(1, Math.min(31, val));
                else if (field === 'hour') val = Math.max(0, Math.min(23, val));
                if (val !== parseInt(this.value)) this.value = String(val).padStart(2, '0');
                else if (this.value.length === 1 && field !== 'year') this.value = '0' + this.value;
            });

            input.addEventListener('change', function() {
                const field = this.dataset.field;
                let val = parseInt(this.value) || 0;
                if (field === 'year') val = Math.max(1900, Math.min(2100, val));
                else if (field === 'month') val = Math.max(1, Math.min(12, val));
                else if (field === 'day') val = Math.max(1, Math.min(31, val));
                else if (field === 'hour') val = Math.max(0, Math.min(23, val));
                this.value = (field === 'year') ? String(val) : String(val).padStart(2, '0');
                const isAm = this.id.startsWith('am');
                if (isAm) capNhatTuAm();
                else capNhatTuDuong();
            });

            // Drag (chuột): kéo lên = tăng, kéo xuống = giảm
            let isDragging = false, startY = 0, startVal = 0;
            input.addEventListener('mousedown', function(e) {
                if (document.activeElement === this) return;
                isDragging = true;
                startY = e.clientY;
                startVal = parseInt(this.value) || 0;
                document.addEventListener('mousemove', onDragMove);
                document.addEventListener('mouseup', onDragEnd);
                e.preventDefault();
                this.style.borderColor = '#f7971e';
            });
            // Mobile: chạm kéo lên = tăng, kéo xuống = giảm (giống chuột trên desktop)
            input.addEventListener('touchstart', function(e) {
                if (!e.touches || !e.touches[0]) return;
                if (document.activeElement === this) return;
                isDragging = true;
                startY = e.touches[0].clientY;
                startVal = parseInt(this.value) || 0;
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd);
                document.addEventListener('touchcancel', onTouchEnd);
                e.preventDefault(); // chặn mở bàn phím / cuộn trang
                this.style.borderColor = '#f7971e';
            }, { passive: false });

            const onDragMove = (e) => {
                if (!isDragging) return;
                const y = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
                const deltaY = startY - y;
                const steps = Math.round(deltaY / 12);
                if (steps !== 0) {
                    let newVal = startVal + steps;
                    const field = input.dataset.field;
                    if (field === 'year') newVal = Math.max(1900, Math.min(2100, newVal));
                    else if (field === 'month') newVal = Math.max(1, Math.min(12, newVal));
                    else if (field === 'day') newVal = Math.max(1, Math.min(31, newVal));
                    else if (field === 'hour') newVal = Math.max(0, Math.min(23, newVal));
                    input.value = (field === 'year') ? String(newVal) : String(newVal).padStart(2, '0');
                    startVal = newVal;
                    startY = y;
                    const isAm = input.id.startsWith('am');
                    if (isAm) capNhatTuAm();
                    else capNhatTuDuong();
                }
            };

            const onTouchMove = (e) => {
                if (e.cancelable && e.preventDefault) e.preventDefault(); // chặn cuộn trang khi kéo
                onDragMove(e);
            };

            const onDragEnd = () => {
                isDragging = false;
                input.style.borderColor = '#2a4a7a';
                document.removeEventListener('mousemove', onDragMove);
                document.removeEventListener('mouseup', onDragEnd);
            };

            const onTouchEnd = () => {
                isDragging = false;
                input.style.borderColor = '#2a4a7a';
                document.removeEventListener('touchmove', onTouchMove);
                document.removeEventListener('touchend', onTouchEnd);
                document.removeEventListener('touchcancel', onTouchEnd);
            };
        });
